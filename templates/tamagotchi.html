<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaito — Mascota</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>
        :root { --bg: #15100a; --text: #f3e7d3; --text-soft: rgba(243, 231, 211, .64); --cristal: rgba(255, 255, 255, .07);
                --cristal-borde: rgba(255, 255, 255, .16); --acc: #e0a44d; }
        html[data-robot="claro"]:not(.night) { --bg: #f6eee3; --text: #2a1f12; --text-soft: rgba(42, 31, 18, .64);
                --cristal: rgba(255, 255, 255, .6); --cristal-borde: rgba(120, 80, 20, .16); }
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; background: var(--bg); color: var(--text); font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
               display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow: hidden; }
        /* cuadrado central seguro de la pantalla redonda */
        .cara { width: 120px; height: 90px; position: relative; }
        .ojo { position: absolute; top: 18px; width: 16px; height: 22px; border-radius: 50%; background: var(--text); }
        .ojo.i { left: 26px; } .ojo.d { right: 26px; }
        .boca { position: absolute; left: 50%; top: 58px; width: 28px; height: 14px; margin-left: -14px; border: 4px solid var(--text);
                border-top: 0; border-radius: 0 0 28px 28px; transition: all .3s; }
        .cara[data-c="triste"] .boca { border-radius: 28px 28px 0 0; border: 4px solid var(--text); border-bottom: 0; top: 64px; }
        .cara[data-c="triste"] .ojo { height: 14px; top: 24px; }
        .cara[data-c="normal"] .boca { height: 0; border-radius: 0; border-bottom: 4px solid var(--text); }
        .barras { width: 240px; display: grid; gap: 8px; }
        .barra { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 8px; font-size: 13px; color: var(--text-soft); }
        .barra i { display: block; height: 10px; border-radius: 6px; background: var(--cristal); border: 1px solid var(--cristal-borde); overflow: hidden; }
        .barra b { display: block; height: 100%; width: 0; background: var(--acc); transition: width .4s; }
        body { touch-action: none; -webkit-user-select: none; user-select: none; }
        .cara { transition: transform .15s; } .cara.come { animation: come .5s; } .cara.sobre { transform: scale(1.12); }
        @keyframes come { 30% { transform: scale(.9, 1.1); } 60% { transform: scale(1.1, .92); } }
        .objetos { display: flex; gap: 14px; }
        .obj { position: relative; width: 70px; height: 70px; touch-action: none; }
        .obj svg { width: 100%; height: 100%; display: block; overflow: visible; }
        .obj .n { position: absolute; right: -2px; bottom: -2px; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 5px;
                  background: var(--acc); color: #15100a; font-size: 13px; font-weight: 700; line-height: 22px; text-align: center; }
        .obj.vacio { opacity: .25; pointer-events: none; }
        .arrastre { position: fixed; left: 0; top: 0; width: 84px; height: 84px; z-index: 99; pointer-events: none; }
        .arrastre svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
        #atras { position: fixed; bottom: 26px; left: 50%; margin-left: -22px; width: 44px; height: 44px; border-radius: 50%;
                 border: 1.5px solid var(--cristal-borde); background: var(--cristal); color: var(--text); font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="cara" id="cara" data-c="normal"><i class="ojo i"></i><i class="ojo d"></i><i class="boca"></i></div>
    <div class="barras">
        <div class="barra">Hambre<i><b id="b-hambre"></b></i></div>
        <div class="barra">Ánimo<i><b id="b-animo"></b></i></div>
        <div class="barra">Energía<i><b id="b-energia"></b></i></div>
    </div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="o-onigiri" viewBox="0 0 64 64">
            <path d="M32 7c5 0 8 4 15 20 5 12 8 20 8 24 0 4-3 6-8 6H17c-5 0-8-2-8-6 0-4 3-12 8-24C24 11 27 7 32 7z" fill="#fff7e8" stroke="#d9c7a3" stroke-width="2"/>
            <path d="M20 42h24l3 14c-1 1-3 1-5 1H22c-2 0-4 0-5-1z" fill="#1f3a2b"/>
            <circle cx="27" cy="26" r="1.6" fill="#e8dcc0"/><circle cx="37" cy="22" r="1.6" fill="#e8dcc0"/><circle cx="33" cy="32" r="1.6" fill="#e8dcc0"/>
        </symbol>
        <symbol id="o-dango" viewBox="0 0 64 64">
            <path d="M32 3v58" stroke="#b98536" stroke-width="3" stroke-linecap="round"/>
            <circle cx="32" cy="16" r="11" fill="#f6a9c0"/><circle cx="32" cy="32" r="11" fill="#fff7e8"/><circle cx="32" cy="48" r="11" fill="#9fd68a"/>
            <circle cx="28" cy="12" r="2.5" fill="#fff" opacity=".55"/><circle cx="28" cy="28" r="2.5" fill="#fff" opacity=".8"/><circle cx="28" cy="44" r="2.5" fill="#fff" opacity=".55"/>
        </symbol>
        <symbol id="o-ocha" viewBox="0 0 64 64">
            <path d="M18 22 20 6M32 22V4M44 22 42 8" stroke="#e0a44d" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/>
            <path d="M10 26h40v14c0 10-8 18-20 18S10 50 10 40z" fill="#fff7e8" stroke="#d9c7a3" stroke-width="2"/>
            <path d="M12 28h36" stroke="#8fbf6a" stroke-width="5" stroke-linecap="round"/>
            <path d="M50 32c9 0 9 14 0 14" fill="none" stroke="#d9c7a3" stroke-width="3" stroke-linecap="round"/>
        </symbol>
    </svg>
    <div class="objetos">
        {% for k in objetos %}
        <div class="obj" data-obj="{{ k }}"><svg viewBox="0 0 64 64"><use href="#o-{{ k }}"/></svg><span class="n" id="n-{{ k }}">0</span></div>
        {% endfor %}
    </div>
    <button id="atras" aria-label="Volver">‹</button>
    <script>
        function pinta(e) {
            ["hambre", "animo", "energia"].forEach(function (k) { document.getElementById("b-" + k).style.width = e[k] + "%"; });
            document.getElementById("cara").dataset.c = e.cara;
            document.querySelectorAll("[data-obj]").forEach(function (b) {
                var n = (e.objetos || {})[b.dataset.obj] || 0;
                document.getElementById("n-" + b.dataset.obj).textContent = n;
                b.classList.toggle("vacio", n < 1);
            });
        }
        fetch("/tamagotchi/estado").then(function (r) { return r.json(); }).then(pinta);

        // Arrastrar un objeto hasta la cara (pointer events: esta pantalla no manda eventos táctiles)
        var cara = document.getElementById("cara"), fantasma = null, origen = null;
        function sobreCara(x, y) {
            var r = cara.getBoundingClientRect();
            return Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)) < 90;
        }
        function mueve(e) { fantasma.style.transform = "translate(" + (e.clientX - 42) + "px," + (e.clientY - 60) + "px)"; cara.classList.toggle("sobre", sobreCara(e.clientX, e.clientY)); }
        document.querySelectorAll("[data-obj]").forEach(function (b) {
            b.addEventListener("pointerdown", function (e) {
                origen = b; b.setPointerCapture(e.pointerId);
                fantasma = document.createElement("div"); fantasma.className = "arrastre";
                fantasma.innerHTML = '<svg viewBox="0 0 64 64"><use href="#o-' + b.dataset.obj + '"/></svg>';
                document.body.appendChild(fantasma); mueve(e);
            });
            b.addEventListener("pointermove", function (e) { if (fantasma) mueve(e); });
            function suelta(e) {
                if (!fantasma) return;
                var dentro = sobreCara(e.clientX, e.clientY), k = origen.dataset.obj;
                fantasma.remove(); fantasma = null; cara.classList.remove("sobre");
                if (!dentro || e.type === "pointercancel") return;
                fetch("/tamagotchi/dar", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: "objeto=" + k }).then(function (r) { return r.json(); }).then(function (d) {
                    pinta(d);
                    if (d.ok) { cara.classList.remove("come"); void cara.offsetWidth; cara.classList.add("come"); }
                });
            }
            b.addEventListener("pointerup", suelta); b.addEventListener("pointercancel", suelta);
        });
        document.getElementById("atras").addEventListener("click", function () { location.replace("/"); });
    </script>
    {% include 'partials/_kiosko.html' %}
</body>
</html>
