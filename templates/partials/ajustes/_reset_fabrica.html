<div class="card full" style="border-color:var(--peligro)">
    <h2>Reset de fábrica</h2>
    <p class="et" style="color:var(--text-soft); margin:4px 0 10px">
        Borra la base de datos, los ajustes y las redes WiFi guardadas. Kaito vuelve
        al modo de configuración inicial. <strong>Es irreversible.</strong> Antes de
        continuar te ofrecerá descargar una copia de la base de datos.
    </p>
    <div class="actions">
        <button type="button" class="btn btn-red" onclick="resetFabrica(this)"><svg class="ico"><use href="#i-bomb"/></svg> Reset de fábrica</button>
    </div>
    <pre id="reset-salida" style="display:none; max-height:200px; overflow:auto;
         background:var(--surface-2); border:1px solid var(--border);
         border-radius:var(--radio-sm); padding:12px; font-size:12px;
         white-space:pre-wrap; word-break:break-word"></pre>
</div>

<script>
// Descarga la BD dejando elegir la ruta (File System Access API) o, si el
// navegador no la soporta, con una descarga normal. -> true si se guardó.
async function descargarBackupBD() {
    var nombre = 'kaito-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '') + '.db';
    try {
        var resp = await fetch('/admin/ajustes/sistema/backup');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var blob = await resp.blob();
        if (window.showSaveFilePicker) {
            var handle = await window.showSaveFilePicker({
                suggestedName: nombre,
                types: [{ description: 'Base de datos SQLite', accept: { 'application/octet-stream': ['.db'] } }]
            });
            var w = await handle.createWritable();
            await w.write(blob);
            await w.close();
        } else {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = nombre;
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
        }
        return true;
    } catch (e) {
        if (e && e.name === 'AbortError') return false;   // canceló el diálogo de guardar
        alert('No se pudo descargar la copia: ' + e);
        return false;
    }
}

async function resetFabrica(btn) {
    var seguro = await window.confirmar(
        'RESET DE FÁBRICA — se borrará la base de datos, los ajustes y las redes WiFi '
        + 'guardadas. Es irreversible. ¿Seguro que quieres continuar?',
        { ok: 'Sí, continuar' }
    );
    if (!seguro) return;

    var quiereCopia = await window.confirmar(
        'Muy recomendable: descarga una copia de la base de datos antes del reset '
        + '(podrás restaurarla después). ¿Descargarla ahora?',
        { ok: 'Descargar y continuar', no: 'Continuar sin copia' }
    );
    if (quiereCopia) {
        var guardada = await descargarBackupBD();
        if (!guardada) return;   // no se guardó la copia: no seguimos con el reset
    }

    btn.disabled = true;
    var pre = document.getElementById('reset-salida');
    pre.style.display = '';
    pre.textContent = 'Enviando…';
    fetch('/admin/ajustes/sistema/reset', { method: 'POST' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            pre.innerHTML = (d.ok ? ico('check-circle') + ' ' : ico('x-circle') + ' ') + esc(d.mensaje || d.error || '');
        })
        .catch(function () {
            pre.innerHTML = ico('warn') + ' Se perdió la conexión. Si el PIN era correcto, el '
                + 'reset está en marcha.';
        })
        .finally(function () { btn.disabled = false; });
}
</script>
