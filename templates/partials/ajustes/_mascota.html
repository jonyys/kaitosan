<div class="card">
    <h2><svg class="ico"><use href="#i-heart"/></svg> Mascota</h2>
    <form method="POST" action="/admin/ajustes/mascota">
        <p class="et" style="color:var(--text-soft); margin:0 0 8px">
            Modo tamagotchi: Kaito tiene hambre, ánimo y sed. Terminar una clase da comida y se la das
            arrastrándola hasta su cara en la pantalla del robot.
        </p>
        <div class="fila">
            <span class="et">Activado</span>
            <input type="checkbox" name="enabled" id="tama-on" value="1" {% if tamagotchi_on %}checked{% endif %}>
        </div>
        <button class="btn btn-green" style="margin-top:10px">Guardar</button>
    </form>
    <p class="et" style="color:var(--text-soft); margin:14px 0 6px">Trampas</p>
    <form method="POST" action="/admin/ajustes/mascota/trampa" style="display:flex; flex-wrap:wrap; gap:8px">
        <button class="btn btn-yellow" name="accion" value="llenar">Llenar todo</button>
        <button class="btn btn-yellow" name="accion" value="vaciar">Vaciar (ver sus caras)</button>
        <button class="btn btn-yellow" name="accion" value="yenes">+500 ¥</button>
        <button class="btn btn-yellow" name="accion" value="objetos">+3 de cada comida y bebida</button>
    </form>
</div>
