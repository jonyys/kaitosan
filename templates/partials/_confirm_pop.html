<style>
    /* Pop-up de confirmación reutilizable: window.confirmar(msg, opts) -> Promise<bool> */
    dialog.flash-pop {
        margin: auto;
        border: 1px solid var(--border-fuerte);
        border-radius: var(--radio);
        padding: 24px 28px;
        min-width: 240px;
        max-width: 92vw;
        text-align: center;
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--sombra);
    }
    dialog.flash-pop::backdrop { background: rgba(91, 58, 74, .45); }
    #confirm-pop .cp-msg { margin: 0 0 18px; font-weight: 700; font-size: 16px; }
    #confirm-pop .cp-actions { display: flex; gap: 10px; justify-content: center; }
    #confirm-pop .cp-actions button {
        min-height: 40px; padding: 8px 20px;
        border: 0; border-radius: var(--radio-pill);
        font: inherit; font-weight: 700; cursor: pointer;
        animation: cp-pop .35s cubic-bezier(.17, .89, .32, 1.28);
    }
    #confirm-pop .cp-yes { background: var(--peligro-tinta); color: #fff; }
    #confirm-pop .cp-no  { background: var(--surface-2); color: var(--text); }
    #confirm-pop .cp-done p { margin: 0; font-weight: 700; font-size: 16px; color: var(--ok-tinta); }
    #confirm-pop .cp-ask, #confirm-pop .cp-done { animation: cp-fade .18s ease-out; }
    @keyframes cp-pop  { from { transform: scale(0);   opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes cp-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>

<dialog id="confirm-pop" class="flash-pop">
    <div class="cp-ask">
        <p class="cp-msg"></p>
        <div class="cp-actions">
            <button type="button" class="cp-no">Cancelar</button>
            <button type="button" class="cp-yes">Sí, borrar</button>
        </div>
    </div>
    <div class="cp-done" hidden><p></p></div>
</dialog>

<script>
    // window.confirmar(mensaje, { ok, no, hechoMsg }) -> Promise<boolean>
    //   ok / no: texto de los botones (por defecto "Sí, borrar" / "Cancelar")
    //   hechoMsg: si se pasa, al confirmar el pop-up cambia a ese texto ~650 ms
    //             antes de resolver (para acciones que recargan la página).
    window.confirmar = function (mensaje, opts) {
        opts = opts || {};
        var cp = document.getElementById('confirm-pop');
        var ask = cp.querySelector('.cp-ask');
        var done = cp.querySelector('.cp-done');
        var yes = cp.querySelector('.cp-yes');
        var no = cp.querySelector('.cp-no');
        cp.querySelector('.cp-msg').textContent = mensaje;
        yes.textContent = opts.ok || 'Sí, borrar';
        no.textContent = opts.no || 'Cancelar';
        ask.hidden = false;
        done.hidden = true;
        if (!cp.showModal) return Promise.resolve(window.confirm(mensaje));

        return new Promise(function (resolve) {
            function limpiar() {
                yes.removeEventListener('click', onYes);
                no.removeEventListener('click', onNo);
                cp.removeEventListener('cancel', onNo);
            }
            function onNo() { limpiar(); if (cp.open) cp.close(); resolve(false); }
            function onYes() {
                limpiar();
                if (opts.hechoMsg) {
                    done.querySelector('p').textContent = opts.hechoMsg;
                    ask.hidden = true;
                    done.hidden = false;
                    setTimeout(function () { resolve(true); }, 650);
                } else {
                    cp.close();
                    resolve(true);
                }
            }
            yes.addEventListener('click', onYes);
            no.addEventListener('click', onNo);
            cp.addEventListener('cancel', onNo);   // tecla Esc
            cp.showModal();
            no.focus();
        });
    };
</script>
