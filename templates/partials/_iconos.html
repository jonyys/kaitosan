<script>
    // Helpers para los mensajes que se pintan desde JS en los ajustes.
    window.ico = function (id) { return '<svg class="ico"><use href="#i-' + id + '"/></svg>'; };
    window.esc = function (s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    };

    // Cierre animado de los desplegables <details class="acc">: al plegar,
    // mantenemos open hasta que termina la animación acc-cerrar.
    (function () {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.addEventListener('click', function (e) {
            var sum = e.target.closest('summary');
            if (!sum) return;
            var d = sum.parentElement;
            if (!d || !d.matches('details.acc') || !d.open || d.classList.contains('cerrando')) return;
            e.preventDefault();
            d.classList.add('cerrando');
            var card = d.querySelector(':scope > .card');
            var fin = function () { d.classList.remove('cerrando'); d.open = false; };
            if (card) {
                card.addEventListener('animationend', function (ev) {
                    if (ev.animationName === 'acc-cerrar') fin();
                }, { once: true });
                setTimeout(fin, 350);
            } else {
                fin();
            }
        });
    })();
</script>
