<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="theme-color" content="#9d3564">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<style>
    /* ================================================================
       Paleta pastel de Kaito — PLAN_AJUSTES §13
       Tokens compartidos por el panel viejo, la página de Ajustes y la
       UI de onboarding. Móvil primero (§13.3.A): diseñado a ~390px y
       ampliado hacia arriba; el escritorio solo tiene que funcionar.
       ================================================================ */
    :root {
        /* superficies */
        --bg:            #fff5f8;
        --bg-alt:        #ffeaf2;
        --surface:       #ffffff;
        --surface-2:     #fff0f5;
        --border:        #f6d4e2;
        --border-fuerte: #efb9d0;

        /* texto (nada de negro puro) */
        --text:          #5b3a4a;
        --text-soft:     #8a6b7a;   /* §13.5: bajado de #9a7f8c para llegar a AA sobre blanco */
        --text-faint:    #c8aeba;   /* solo placeholders / estado vacío decorativo */

        /* rosas */
        --rosa:          #f7b8d2;
        --rosa-medio:    #f090b6;
        --rosa-accion:   #d9568c;   /* anillo de foco, enlaces sobre claro */
        --rosa-tinta:    #9d3564;   /* títulos y texto sobre rosa claro; botón primario */

        /* acentos que combinan */
        --lavanda:       #cdbdec;
        --melocoton:     #ffd6be;
        --menta:         #b7e6d1;

        /* estados (…-tinta = variante con contraste AA para texto, §13.5) */
        --ok:            #3fae86;   --ok-bg:      #e7f7f0;   --ok-tinta:      #1c7355;
        --aviso:         #d98a2b;   --aviso-bg:   #fff4e2;   --aviso-tinta:   #9a5a11;
        --peligro:       #c85a5a;   --peligro-bg: #fdecec;   --peligro-tinta: #a83232;

        /* forma */
        --radio:         18px;
        --radio-sm:      12px;
        --radio-pill:    999px;
        --sombra:        0 8px 24px rgba(217, 86, 140, 0.15);
        --sombra-sm:     0 2px 8px  rgba(217, 86, 140, 0.12);

        /* toque (§13.3.A: áreas ≥ 48px) */
        --toque:         48px;
        --fuente: 'M PLUS Rounded 1c', 'Nunito', 'Segoe UI', system-ui, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* Reservamos siempre el hueco de la barra de scroll: al plegar/desplegar
       un desplegable el ancho no cambia y no hay salto lateral. */
    html { -webkit-text-size-adjust: 100%; overflow-y: scroll; scrollbar-gutter: stable; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--fuente);
        font-size: 16px;                 /* base ≥ 16px: iOS no hace zoom al enfocar inputs */
        line-height: 1.6;
        padding: clamp(14px, 4vw, 28px);
        touch-action: manipulation;      /* mata el zoom por doble toque (§13.3.B) */
    }

    /* ---- Títulos ---- */
    h1 {
        color: var(--rosa-tinta);
        font-weight: 700;
        font-size: clamp(20px, 5vw, 26px);
        margin-bottom: clamp(18px, 5vw, 30px);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    h2 {
        color: var(--rosa-tinta);
        font-weight: 700;
        font-size: clamp(16px, 4vw, 19px);
        margin-bottom: 15px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
    }
    a { color: var(--rosa-accion); }

    /* ---- Rejilla: una columna en móvil, dos solo en pantallas anchas ---- */
    .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 20px;
    }
    .card {
        background: var(--surface);
        border: 1px solid var(--border);   /* visible, no solo sombra (§13.4) */
        border-radius: var(--radio);
        box-shadow: var(--sombra);
        padding: clamp(16px, 4vw, 24px);
        overflow-x: auto;                  /* tablas anchas hacen scroll dentro, no rompen la página */
    }
    @media (min-width: 640px) {
        .grid { grid-template-columns: 1fr 1fr; gap: 20px; }
        .card.full { grid-column: 1 / -1; }
    }

    /* ---- Tablas (panel viejo). En Ajustes se usan "filas de ajuste", no tablas ---- */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    @media (max-width: 639px) { table { min-width: 480px; } }
    th {
        background: var(--bg-alt);
        color: var(--rosa-tinta);
        padding: 10px;
        text-align: left;
        font-weight: 700;
    }
    td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
        max-width: 400px;
        word-wrap: break-word;
    }
    @media (hover: hover) {
        tr:hover td { background: var(--surface-2); }
    }

    /* ---- Botones: pill grandes, feedback al tocar, sin depender de :hover ---- */
    .btn {
        min-height: var(--toque);
        padding: 12px 18px;
        border: none;
        border-radius: var(--radio-pill);
        cursor: pointer;
        text-decoration: none;      /* <a class="btn"> no debe ir subrayado */
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.2;
        box-shadow: var(--sombra-sm);
        transition: transform .08s ease, filter .15s ease;
    }
    .btn:active { transform: scale(.98); }
    @media (hover: hover) {
        .btn:hover { filter: brightness(1.03); transform: translateY(-1px); }
    }

    /* primario (btn-blue / btn-green): rosa-tinta sólido, blanco 700 → AA */
    .btn-blue, .btn-green {
        background: var(--rosa-tinta);
        background-image: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,0));
        color: #fff;
    }
    /* secundario */
    .btn-yellow {
        background: var(--surface-2);
        color: var(--rosa-tinta);
        border: 1px solid var(--border-fuerte);
        box-shadow: none;
    }
    /* peligro: nunca rojo saturado; texto con contraste AA */
    .btn-red {
        background: var(--peligro-bg);
        color: var(--peligro-tinta);
        border: 1px solid var(--peligro);
        box-shadow: none;
    }
    /* fantasma: transparente con borde. Explícito para que iOS no le meta
       su tinte de sistema al <button> sin fondo. */
    .btn-ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border-fuerte);
        box-shadow: none;
    }

    /* ---- Cabecera de las páginas de japonés (partials/_japones_nav.html) ---- */
    .jp-wrap { max-width: 1100px; margin: 0 auto; }
    .jp-wrap h1 { justify-content: space-between; flex-wrap: wrap; }
    /* botón redondo de cabecera: casa y menú, mismo tamaño */
    .hdr-btn { width: 48px; height: 48px; min-height: 48px; padding: 0; border-radius: 50%; }
    /* menú de navegación (☰): <details> nativo, sin JS */
    .navmenu { position: relative; }
    .navmenu > summary {
        list-style: none; cursor: pointer;
        width: 48px; height: 48px;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid var(--border-fuerte); border-radius: 50%;
        background: var(--surface-2); color: var(--rosa-tinta);
        font-size: 20px; line-height: 1;
    }
    .navmenu > summary::-webkit-details-marker { display: none; }
    .navmenu[open] > summary { border-color: var(--rosa-accion); }
    .navmenu-panel {
        position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
        display: flex; flex-direction: column;
        min-width: 200px; overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border-fuerte); border-radius: var(--radio-sm);
        box-shadow: var(--sombra);
    }
    .navmenu[open] > .navmenu-panel {
        transform-origin: top;
        animation: navmenu-in .28s cubic-bezier(.22, 1, .36, 1);
    }
    /* misma sensación que el acordeón de los paneles: abre con un barrido de
       arriba a abajo (navmenu-in) y cierra al revés (navmenu-out, lo pilota el
       JS de _japones_nav.html con la clase .cerrando). */
    .navmenu.cerrando > .navmenu-panel {
        transform-origin: top;
        animation: navmenu-out .18s cubic-bezier(.4, 0, 1, 1) forwards;
    }
    @keyframes navmenu-in {
        from { opacity: 0; transform: translateY(-8px); clip-path: inset(0 0 100% 0); }
        to   { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 0 0); }
    }
    @keyframes navmenu-out {
        from { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 0 0); }
        to   { opacity: 0; transform: translateY(-8px); clip-path: inset(0 0 100% 0); }
    }
    @media (prefers-reduced-motion: reduce) {
        .navmenu[open] > .navmenu-panel,
        .navmenu.cerrando > .navmenu-panel { animation: none; }
    }
    .navmenu-panel a {
        display: block; padding: 12px 14px;
        color: var(--text); text-decoration: none;
        font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    .navmenu-panel a + a { border-top: 1px solid var(--border); }
    .navmenu-panel a:hover { background: var(--surface-2); }

    /* ---- Pop-ups (<dialog>) ---- */
    /* Con un pop-up abierto, la página de detrás no hace scroll (lo pilota el
       JS de _iconos.html con la clase .modal-abierto). */
    html.modal-abierto, html.modal-abierto body { overflow: hidden; }

    /* Al deslizar de ficha a ficha en móvil se empezaba a seleccionar el
       relleno/esquina del <dialog> junto al botón X. La zona "chrome" no
       selecciona; el texto de la ficha (.ficha-body) sí. */
    dialog.ficha-pop, #voc-pop { -webkit-user-select: none; user-select: none; }
    .pop-x { -webkit-tap-highlight-color: transparent; }
    .ficha-body { -webkit-user-select: text; user-select: text; }

    /* "Pasar página" al deslizar de lado entre fichas: el cuerpo sale por un
       lado y el nuevo entra por el otro. El wrapper es .ficha-body. */
    @keyframes ficha-out-next { to   { opacity: 0; transform: translateX(-26px); } }
    @keyframes ficha-in-next  { from { opacity: 0; transform: translateX( 26px); } }
    @keyframes ficha-out-prev { to   { opacity: 0; transform: translateX( 26px); } }
    @keyframes ficha-in-prev  { from { opacity: 0; transform: translateX(-26px); } }
    .ficha-body.slide-out-next { animation: ficha-out-next .16s ease-in forwards; }
    .ficha-body.slide-in-next  { animation: ficha-in-next  .2s  ease-out; }
    .ficha-body.slide-out-prev { animation: ficha-out-prev .16s ease-in forwards; }
    .ficha-body.slide-in-prev  { animation: ficha-in-prev  .2s  ease-out; }
    @media (prefers-reduced-motion: reduce) {
        .ficha-body[class*="slide-"] { animation: none !important; }
    }

    /* ---- Controles nativos (§13.3.A): time, number, range, select, color… ---- */
    input, select, textarea, button { font-family: inherit; }
    input[type="text"],
    input[type="password"],
    input[type="search"],
    input[type="number"],
    input[type="time"],
    input[type="date"],
    input[type="datetime-local"],
    select,
    textarea {
        width: 100%;
        min-height: var(--toque);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radio-sm);
        color: var(--text);
        padding: 10px 12px;
        font-size: 16px;                  /* evita el zoom de iOS */
        margin-bottom: 8px;
    }
    textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--rosa-accion);
        box-shadow: 0 0 0 3px rgba(217, 86, 140, .25);
    }
    input[type="range"] { accent-color: var(--rosa-accion); height: var(--toque); }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--rosa-accion); width: 22px; height: 22px; }
    ::placeholder { color: var(--text-faint); }

    /* ---- Utilidades ---- */
    .actions { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .badge {
        background: var(--bg-alt);
        color: var(--rosa-tinta);
        padding: 3px 10px;
        border-radius: var(--radio-pill);
        font-size: 11px;
        font-weight: 700;
    }
    .alert {
        padding: 11px 15px;
        border-radius: var(--radio-sm);
        margin-bottom: 15px;
        font-size: 14px;
        font-weight: 500;
    }
    .alert-success { background: var(--ok-bg);      border: 1px solid var(--ok);      color: var(--ok-tinta); }
    .alert-error   { background: var(--peligro-bg); border: 1px solid var(--peligro); color: var(--peligro-tinta); }
    .empty { color: var(--text-soft); font-style: italic; text-align: center; padding: 20px; }

    /* ---- Fila de formulario: apilada en móvil, 3 columnas solo en ancho ---- */
    .form-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        align-items: start;
        margin-bottom: 8px;
    }
    @media (min-width: 640px) {
        .form-row { grid-template-columns: 1fr 2fr auto; }
    }

    /* ---- Barra "Guardar" fija abajo en formularios largos (§13.3.A) ---- */
    .guardar-fijo {
        position: sticky;
        bottom: 0;
        background: linear-gradient(to top, var(--bg) 70%, transparent);
        padding: 12px 0 4px;
        margin-top: 8px;
    }

    /* ---- Secciones plegables (<details>): acordeón en vez de todo apilado,
       para no hacer scroll hasta el final para ver las secciones de abajo ---- */
    .acc-list { max-width: 900px; margin: 0 auto; }
    details.acc { margin-bottom: 12px; }
    details.acc > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: var(--toque);
        padding: 14px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radio);
        box-shadow: var(--sombra-sm);
        color: var(--rosa-tinta);
        font-weight: 700;
        font-size: clamp(15px, 4vw, 18px);
    }
    details.acc > summary::-webkit-details-marker { display: none; }
    details.acc > summary::after {
        content: "▸";
        margin-left: auto;
        font-size: 14px;
        transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), color .2s ease;
    }
    details.acc[open] > summary::after { transform: rotate(90deg) scale(1.15); }
    details.acc > summary { transition: background .2s ease, color .2s ease, border-radius .2s ease; }
    details.acc > summary:hover { background: var(--surface-2); }
    details.acc > summary:active { transform: scale(.995); }
    details.acc[open] > summary {
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
    }
    details.acc > .card {
        margin-top: 0;
        border-top: 0;
        border-top-left-radius: 0;
        border-top-right-radius: 0;
    }

    /* ---- Animación al desplegar ---- */
    @keyframes acc-abrir {
        from { opacity: 0; transform: translateY(-8px); clip-path: inset(0 0 100% 0); }
        to   { opacity: 1; transform: translateY(0);     clip-path: inset(0 0 0 0); }
    }
    @keyframes acc-fila {
        from { opacity: 0; transform: translateY(6px); }
        /* transform:none, no translateY(0): con animation-fill-mode both, translateY(0)
           dejaría un stacking context permanente en cada fila y taparía el menú "⋯". */
        to   { opacity: 1; transform: none; }
    }
    details.acc[open] > .card {
        animation: acc-abrir .28s cubic-bezier(.22, 1, .36, 1);
        transform-origin: top;
    }

    /* Cierre animado (lo pilota el JS de _iconos.html con la clase .cerrando). */
    @keyframes acc-cerrar {
        from { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 0 0); }
        to   { opacity: 0; transform: translateY(-8px); clip-path: inset(0 0 100% 0); }
    }
    details.acc.cerrando > .card {
        animation: acc-cerrar .22s cubic-bezier(.4, 0, 1, 1) forwards;
        transform-origin: top;
    }
    details.acc.cerrando > summary::after { transform: rotate(0) scale(1); }
    details.acc.cerrando > summary {
        border-bottom-left-radius: var(--radio);
        border-bottom-right-radius: var(--radio);
    }
    /* Cascada de los elementos de dentro de la card. */
    details.acc[open] > .card > *:not(table),
    details.acc[open] > .card > table tr {
        animation: acc-fila .34s ease-out both;
    }
    details.acc[open] > .card > *:not(table):nth-child(1)   { animation-delay: .04s; }
    details.acc[open] > .card > *:not(table):nth-child(2)   { animation-delay: .09s; }
    details.acc[open] > .card > *:not(table):nth-child(3)   { animation-delay: .14s; }
    details.acc[open] > .card > *:not(table):nth-child(n+4) { animation-delay: .18s; }
    details.acc[open] > .card > table tr:nth-child(1)  { animation-delay: .12s; }
    details.acc[open] > .card > table tr:nth-child(2)  { animation-delay: .17s; }
    details.acc[open] > .card > table tr:nth-child(3)  { animation-delay: .22s; }
    details.acc[open] > .card > table tr:nth-child(4)  { animation-delay: .27s; }
    details.acc[open] > .card > table tr:nth-child(n+5){ animation-delay: .31s; }

    @media (prefers-reduced-motion: reduce) {
        details.acc > summary::after,
        details.acc[open] > .card,
        details.acc[open] > .card > *,
        details.acc[open] > .card > table tr { animation: none; transition: none; }
    }
    details.acc .count { color: var(--text-soft); font-weight: 700; }
    /* El título ya está en el <summary>: no lo repitas dentro de la card. */
    details.acc > .card > h2:first-child,
    details.acc > .card > div:first-child > h2 { display: none; }
    /* Si esa cabecera tenía un botón al lado del título, que quede a la derecha. */
    details.acc > .card > div:first-child:has(> h2) { justify-content: flex-end; }

    /* Filas etiqueta/valor (Sistema, y las pantallas de Ajustes). */
    .fila {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px 14px;
        min-height: 56px;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
    }
    .fila:last-child { border-bottom: 0; padding-bottom: 0; }
    .fila .et  { font-weight: 500; }
    .fila .val { color: var(--text-soft); font-weight: 700; text-align: right; }

    .medidor {
        height: 10px;
        margin-top: 2px;
        border-radius: var(--radio-pill);
        background: var(--bg-alt);
        overflow: hidden;
    }
    .medidor > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--rosa), var(--rosa-medio));
    }
</style>
