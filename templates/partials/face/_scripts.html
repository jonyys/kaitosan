<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
  // Motor de la cara: un solo bucle con muelles. Cada estado solo cambia hacia dónde
  // tienden los valores, así nada salta: todo llega con su inercia desde donde esté.
  const socket = io();
  const face = document.getElementById("face");
  const $$ = (s) => [...document.querySelectorAll(s)];
  const azar = (a, b) => a + Math.random() * (b - a);
  const entre = ([a, b]) => azar(a, b);
  const acotar = (v, a, b) => Math.min(b, Math.max(a, v));

  // k = rigidez, d = amortiguación. Poca d rebota; mucha llega sin pasarse.
  const muelle = (k, d, x = 0) => ({ k, d, x, v: 0, t: x });
  const m = {
    miradaX: muelle(900, 56),
    miradaY: muelle(900, 56),
    cabezaX: muelle(30, 9),
    cabezaY: muelle(30, 9),
    cabezaR: muelle(26, 8),
    ceja: muelle(110, 14),
    cejaDif: muelle(110, 14),
    cejaRot: muelle(90, 13),
    cejaArco: muelle(110, 14), // más curvada (+) o más plana (-)
    enfasisIzq: muelle(90, 11), // subidas breves de cada ceja al hablar o al tocar
    enfasisDer: muelle(90, 11),
    abre: muelle(170, 14, 1),
    parpado: muelle(80, 16),
    inferior: muelle(80, 16),
    pupila: muelle(50, 12, 1),
    boca: muelle(420, 30),
    // Gestos kawaii
    sonrisa: muelle(170, 20),
    bocaO: muelle(170, 20),
    bocaMini: muelle(170, 20),
    aplasta: muelle(260, 10), // poca amortiguación: rebota como gelatina
    cierraIzq: muelle(260, 30), // párpado de un solo ojo (guiño)
    cierraDer: muelle(260, 30),
    // Emociones al hablar
    triste: muelle(150, 20), // boca hacia abajo
    agacha: muelle(40, 11), // cabeza abajo (+) o echada atrás (-)
    bocaX: muelle(120, 16), // boca torcida a un lado
    // Propios del cambio a sensei y al reloj: los estados no los tocan a medias
    cierre: muelle(120, 18), // ojos cerrados
    serio: muelle(60, 12), // cabeza baja
  };
  const muelles = Object.values(m);

  // Valores de reposo y ritmo de cada estado. Tiempos en ms; mirada en unidades del ojo.
  const MODOS = {
    idle: { parpado: 0, inferior: 0, ceja: 0, dif: 0, rot: 0, abre: 1, pupila: 1, boca: 0, radio: [13, 8], cadaMirada: [1400, 4200], cadaParpadeo: [2600, 6000] },
    listening: { parpado: 0, inferior: 0, ceja: -8, dif: 2.5, rot: -2, arco: 0.2, abre: 1.05, pupila: 1.14, boca: 0.1, radio: [3, 2], cadaMirada: [2500, 5000], cadaParpadeo: [4000, 7500], inclina: 2.5 },
    thinking: { parpado: 0, inferior: 0, ceja: -3, dif: 0, rot: 5, arco: -0.15, abre: 1, pupila: 0.94, boca: 0, radio: [3, 2], centro: [9, -8], alterna: true, cadaMirada: [1000, 2200], cadaParpadeo: [3000, 6000] },
    speaking: { parpado: 0, inferior: 0, ceja: -1, dif: 0, rot: 0, abre: 1, pupila: 1.03, boca: 0, radio: [5, 3], cadaMirada: [1200, 3000], cadaParpadeo: [2200, 5000] },
    happy: { parpado: 0, inferior: 0.42, ceja: -7, dif: 0, rot: -4, arco: 0.3, abre: 1.02, pupila: 1.1, boca: 0.2, radio: [4, 2], cadaMirada: [1500, 3000], cadaParpadeo: [2500, 5000] },
    error: { parpado: 0.16, inferior: 0, ceja: 5, dif: 0, rot: 12, arco: -0.35, abre: 0.98, pupila: 0.9, boca: 0, radio: [3, 2], cadaMirada: [800, 1800], cadaParpadeo: [2000, 4000] },
  };
  const estados = Object.keys(MODOS);
  let estado = "idle";
  let modo = MODOS.idle;
  let hablando = false;

  const prox = { mirada: 0, micro: 0, parpadeo: 0, gesto: 0, finGesto: 0, finDedo: 0, sueno: 0, enfasis: 0 };
  // Un gesto cada 25-35 s en reposo: más a menudo distrae si trabajas al lado
  const CADA_GESTO = [25000, 35000];
  // A partir de aquí sin que nadie le hable ni lo toque, le entra sueño
  const EMPIEZA_SUENO = 210000; // 3 min y medio
  // Antes del reloj: 12 s quedándose dormido, 1,5 s cerrando los ojos del todo
  // y 15 s durmiendo con zZz
  const CAE_MS = 12000;
  const CIERRA_MS = 1500;
  const DORMIRSE_MS = CAE_MS + CIERRA_MS + 15000;
  window.kaitoDormirseMs = DORMIRSE_MS; // el kiosko lo lanza con esta antelación
  const miradaBase = { x: 0, y: 0 };
  // Pizarra del sensei puesta (mostrarJaponesSensei) y cuánto baja la mirada para leerla
  let hayPizarra = false;
  const MIRA_PIZARRA = 10;
  let ladoPensando = 1;
  let quietoDesde = 0;
  let ahora = 0;

  // ── Piezas ──────────────────────────────────────────────────────────────────
  // Cuánto miran hacia la nariz: 0 = iris centrados (aspecto de sapo), 1 = como están
  // dibujados (al mirar a un lado, el ojo contrario se corta contra el borde).
  const MIRADA_HACIA_NARIZ = 0.6;
  // Inclinación del ojo en radianes (la propiedad CSS rotate; los de sensei no tienen)
  const giroOjo = (el) => ((parseFloat(getComputedStyle(el).rotate) || 0) * Math.PI) / 180;
  const ojos = $$(".eye").map((el) => ({
    el,
    iris: el.querySelector(".iris"),
    pupila: el.querySelector(".pupila"),
    sup: el.querySelector(".parpado-sup"),
    inf: el.querySelector(".parpado-inf"),
    espejo: el.dataset.espejo ? -1 : 1,
    recorrido: +el.dataset.recorrido,
    recorridoInf: +el.dataset.recorridoInf,
    escala: +el.dataset.escala,
    // Cuánto está dibujado el iris hacia la nariz respecto al centro del ojo
    haciaNariz: el.classList.contains("eye-sensei") ? 9.6 : 11.1,
    cos: Math.cos(giroOjo(el)),
    sin: Math.sin(giroOjo(el)),
    sensei: el.classList.contains("eye-sensei"),
    derecho: el.classList.contains("eye-right") || el.classList.contains("eye-sensei-right"),
  }));
  const cejas = $$(".eyebrow").map((el) => ({
    el,
    lado: el.className.baseVal.includes("left") ? -1 : 1,
    sensei: el.classList.contains("eyebrow-sensei"),
  }));

  // Las dos formas de la boca tienen los mismos comandos: basta mezclar los números.
  const NUM = /-?\d+(?:\.\d+)?/g;
  const boca = {
    path: document.querySelector("path.mouth-single"),
    svg: document.querySelector("svg.mouth"),
    cerrada: "M 265.112 239.115 C 265.112 243.048 255.383 247.237 243.382 247.237 C 231.381 247.237 221.652 243.048 221.652 239.115 C 221.652 235.182 230.758 240.737 242.759 240.737 C 254.76 240.737 265.112 235.182 265.112 239.115 Z",
    abierta: "M 265.112 239.115 C 265.112 248.5 255.383 255.0 243.382 255.0 C 231.381 255.0 221.652 248.5 221.652 239.115 C 221.652 229.73 231.381 233.23 243.382 233.23 C 255.383 233.23 265.112 229.73 265.112 239.115 Z",
  };
  // Formas de los gestos. Mismos comandos que la cerrada: se suman como desplazamientos sobre ella.
  const FORMAS_BOCA = {
    sonrisa: "M 265.112 239.115 C 265.112 249.5 255.383 256.5 243.382 256.5 C 231.381 256.5 221.652 249.5 221.652 239.115 C 221.652 236.6 231.381 240.2 243.382 240.2 C 255.383 240.2 265.112 236.6 265.112 239.115 Z",
    o: "M 253.4 245 C 253.4 251.6 248.9 257 243.382 257 C 237.9 257 233.4 251.6 233.4 245 C 233.4 238.4 237.9 233 243.382 233 C 248.9 233 253.4 238.4 253.4 245 Z",
    triste: "M 265.112 246.885 C 265.112 242.952 255.383 238.763 243.382 238.763 C 231.381 238.763 221.652 242.952 221.652 246.885 C 221.652 250.818 230.758 245.263 242.759 245.263 C 254.76 245.263 265.112 250.818 265.112 246.885 Z",
    mini: "M 247.4 243 C 247.4 245.5 245.6 247.5 243.382 247.5 C 241.1 247.5 239.4 245.5 239.4 243 C 239.4 240.5 241.1 238.5 243.382 238.5 C 245.6 238.5 247.4 240.5 247.4 243 Z",
  };
  boca.de = boca.cerrada.match(NUM).map(Number);
  boca.a = boca.abierta.match(NUM).map(Number);
  boca.formas = Object.fromEntries(Object.entries(FORMAS_BOCA).map(([k, d]) => [k, d.match(NUM).map(Number)]));

  // Solo toca el DOM si el valor cambia: si algo está quieto, no se repinta.
  const cache = new WeakMap();
  function poner(el, clave, valor) {
    let c = cache.get(el);
    if (!c) cache.set(el, (c = {}));
    if (c[clave] === valor) return;
    c[clave] = valor;
    if (clave === "transform" || clave === "d") el.setAttribute(clave, valor);
    else el.style.transform = valor;
  }
  // Una décima de px basta para que se vea fluido y evita casi todos los repintados:
  // en la Pi es lo que más consume. Escalas y giros necesitan más precisión.
  const f = (v) => v.toFixed(1);
  const f2 = (v) => v.toFixed(2);

  // ── Parpadeo: baja rápido y sube despacio, como un párpado real ─────────────
  let parpadeo = null;
  function parpadear(lento = 1) {
    parpadeo = { ini: ahora, cierra: 75 * lento, queda: 25 * lento, abre: 170 * lento };
  }
  // Parpadeo de sueño: baja despacio y sube todavía más despacio y suave,
  // como si costara abrir los ojos
  function parpadearConSueno(lento) {
    parpadeo = { ini: ahora, cierra: 90 * lento, queda: 60 * lento, abre: 420 * lento, suave: true };
  }
  function curvaParpadeo() {
    if (!parpadeo) return 0;
    const e = ahora - parpadeo.ini;
    if (e < parpadeo.cierra) return (e / parpadeo.cierra) ** 2;
    if (e < parpadeo.cierra + parpadeo.queda) return 1;
    const u = (e - parpadeo.cierra - parpadeo.queda) / parpadeo.abre;
    if (u >= 1) {
      parpadeo = null;
      return 0;
    }
    if (parpadeo.suave) return 1 - u * u * (3 - 2 * u); // arranca despacio, sin tirón
    return (1 - u) ** 2;
  }

  // ── Mirada: saltos rápidos entre puntos, como los ojos de verdad ────────────
  function mirar(x, y) {
    const salto = Math.hypot(x - miradaBase.x, y - miradaBase.y);
    miradaBase.x = x;
    miradaBase.y = y;
    m.miradaX.t = x;
    m.miradaY.t = y;
    m.cabezaX.t = x * 0.35; // la cabeza acompaña, más tarde y menos
    m.cabezaY.t = y * 0.2;
    if (salto > 9 && Math.random() < 0.4) parpadear();
  }

  function nuevaMirada() {
    // Con la pizarra puesta casi siempre la mira a ella, y de vez en cuando a Laura
    if (hayPizarra) {
      if (Math.random() < 0.7) mirar(azar(-3, 3), MIRA_PIZARRA + azar(-1, 1));
      else mirar(0, 0);
      return;
    }
    // Una emoción puede fijar hacia dónde mira (triste al suelo, pensativo arriba)
    if (emocionActual && EMOCIONES[emocionActual].mira) {
      const [x, y] = EMOCIONES[emocionActual].mira;
      mirar(x + azar(-2.5, 2.5), y + azar(-1.5, 1.5));
      return;
    }
    if (modo.alterna) {
      ladoPensando = -ladoPensando;
      m.cejaDif.t = -6 * ladoPensando; // sube la ceja del lado hacia el que mira
    }
    const cx = (modo.centro ? modo.centro[0] : 0) * ladoPensando;
    const cy = modo.centro ? modo.centro[1] : 0;
    if (!modo.centro && Math.random() < 0.35) mirar(0, 0); // suele volver al frente
    else mirar(cx + azar(-modo.radio[0], modo.radio[0]), cy + azar(-modo.radio[1], modo.radio[1]));
  }

  function aplicarModo() {
    m.parpado.t = modo.parpado;
    m.inferior.t = modo.inferior;
    m.ceja.t = modo.ceja;
    m.cejaDif.t = modo.dif;
    m.cejaRot.t = modo.rot;
    m.cejaArco.t = modo.arco || 0;
    m.abre.t = modo.abre;
    m.pupila.t = modo.pupila;
    m.cabezaR.t = modo.inclina ? modo.inclina * (Math.random() < 0.5 ? -1 : 1) : 0;
    // Lo que solo usan gestos y emociones vuelve a cero
    m.sonrisa.t = m.bocaO.t = m.bocaMini.t = m.aplasta.t = 0;
    m.cierraIzq.t = m.cierraDer.t = 0;
    m.triste.t = m.agacha.t = m.bocaX.t = 0;
  }

  // ── Gestos de cuando no pasa nada ───────────────────────────────────────────
  const GESTOS = [
    function ladear() {
      const lado = Math.random() < 0.5 ? -1 : 1;
      m.cabezaR.t = azar(1.5, 3) * lado;
      m.cejaDif.t = -4 * lado;
      return azar(2500, 4000);
    },
    function dobleMirada() {
      const lado = Math.random() < 0.5 ? -1 : 1;
      mirar(13 * lado, 0);
      setTimeout(() => estado === "idle" && mirar(-13 * lado, 1), 520);
      setTimeout(() => estado === "idle" && mirar(0, 0), 1100);
      prox.mirada = ahora + 2400;
      return 1400;
    },
    function suspiro() {
      m.cabezaY.v -= 16;
      m.ceja.t = -3;
      m.cejaRot.t = -6;
      m.cejaArco.t = 0.2;
      parpadear(1.8);
      return 1700;
    },
    function asombro() {
      m.abre.v += 0.9;
      m.ceja.v -= 50;
      m.cejaArco.t = 0.4;
      m.pupila.t = 1.15;
      return 900;
    },
  ];

  function gestos() {
    if (estado !== "idle" || gesto) return;
    if (prox.finGesto && ahora > prox.finGesto) {
      prox.finGesto = 0;
      aplicarModo();
    }
    const quieto = ahora - quietoDesde;
    // Tras un rato sin nada le entra sueño: parpadeos lentos entre gesto y gesto,
    // nunca ojos a medio cerrar
    if (quieto > EMPIEZA_SUENO && ahora > prox.sueno && !prox.finGesto) {
      parpadear(2.4);
      prox.sueno = ahora + azar(5000, 9000);
    }
    if (ahora < prox.gesto) return;
    prox.gesto = ahora + entre(CADA_GESTO);
    // Mitad de las veces uno de los kawaii, mitad uno de los pequeños
    if (Math.random() < 0.5 && hacerGesto(sortearKawaii())) return;
    prox.finGesto = ahora + GESTOS[Math.floor(Math.random() * GESTOS.length)]();
    prox.gesto = ahora + entre(CADA_GESTO);
  }

  function comportamiento() {
    if (gesto) correrGesto();
    if (ahora > prox.finDedo && !gesto) {
      if (ahora > prox.mirada) {
        nuevaMirada();
        prox.mirada = ahora + entre(modo.cadaMirada);
      }
      if (ahora > prox.micro) {
        // Microsacadas: los ojos vivos nunca están del todo quietos
        m.miradaX.t = miradaBase.x + azar(-1.1, 1.1);
        m.miradaY.t = miradaBase.y + azar(-0.8, 0.8);
        prox.micro = ahora + azar(500, 1500);
      }
    }
    if (ahora > prox.parpadeo && !gesto) {
      parpadear();
      if (Math.random() < 0.15) setTimeout(parpadear, 300); // doble ocasional
      prox.parpadeo = ahora + entre(modo.cadaParpadeo);
    }
    gestos();
    if (hablando) {
      // Ritmo de sílabas: dos senos que no coinciden nunca, para que no suene a metrónomo
      const t = ahora / 1000;
      const silaba = Math.abs(Math.sin(t * 9.5)) * 0.6 + Math.abs(Math.sin(t * 5.7 + 1)) * 0.4;
      m.boca.t = 0.15 + 0.8 * silaba;
      if (ahora > prox.enfasis) enfasisCejas();
    } else {
      m.boca.t = modo.boca;
    }
  }

  // Al hablar las cejas suben un momento, casi siempre las dos y a veces solo una
  function enfasisCejas() {
    prox.enfasis = ahora + azar(1300, 3600);
    const e = emocionActual ? EMOCIONES[emocionActual].enfasis : null;
    const fuerza = azar(60, 130) * (e == null ? 1 : e);
    const cual = Math.random();
    if (cual < 0.85) m.enfasisIzq.v -= fuerza;
    if (cual < 0.7 || cual >= 0.85) m.enfasisDer.v -= fuerza;
  }

  // ── Gestos kawaii ───────────────────────────────────────────────────────────
  // Cada uno es una secuencia [ms desde el inicio, qué cambia] sobre los muelles,
  // más una clase .gesto-<nombre> en #face que enciende sus adornos (_estilos.html).
  // Los ojos siguen abiertos salvo en el guiño y el sueñito, que cierran con los
  // párpados de verdad.
  let gesto = null;
  let respiraExtra = 0;
  let alDormirse = null;

  // Mirar sin el parpadeo que a veces acompaña a los saltos de mirada
  function mirarSuave(x, y) {
    miradaBase.x = x;
    miradaBase.y = y;
    m.miradaX.t = x;
    m.miradaY.t = y;
    m.cabezaX.t = x * 0.35;
    m.cabezaY.t = y * 0.2;
  }
  function vuelveAlReposo() {
    respiraExtra = 0;
    aplicarModo();
    mirarSuave(0, 0);
  }

  function despertar() {
    face.classList.add("despierta");
    respiraExtra = 0;
    m.parpado.t = 0;
    m.inferior.t = 0;
    m.abre.v += 1.4;
    m.ceja.t = 0;
    m.ceja.v -= 70;
    m.cejaRot.t = 0;
    m.cejaArco.t = 0.35;
    m.cabezaR.t = 0;
    m.cabezaY.t = 0;
    m.cabezaY.v -= 30;
    m.bocaMini.t = 0;
    m.bocaO.t = 0.5;
  }

  const KAWAII = {
    feliz: { dur: 2600, peso: 3, pasos: [
      [0, () => { m.inferior.t = 0.45; m.ceja.t = -7; m.cejaRot.t = -4; m.cejaArco.t = 0.3; m.ceja.v -= 40; m.sonrisa.t = 1; m.pupila.t = 1.12; m.cabezaY.v -= 40; }],
      [450, () => { m.cabezaY.v -= 35; m.ceja.v -= 35; }],
      [2100, () => { m.sonrisa.t = 0; m.inferior.t = 0; }],
    ] },
    guino: { dur: 2000, peso: 2, pasos: [
      [0, () => { m.cierraDer.t = 1; m.cejaDif.t = 8; m.cejaArco.t = 0.2; m.ceja.v -= 30; m.sonrisa.t = 0.9; m.cabezaR.t = -4; }],
      [1250, () => { m.cierraDer.t = 0; m.cejaDif.t = 0; m.cejaArco.t = 0; m.cabezaR.t = 0; }],
      [1600, () => { m.sonrisa.t = 0; }],
    ] },
    corazones: { dur: 3200, peso: 1, pasos: [
      [0, () => { m.pupila.t = 0; m.abre.t = 1.08; m.abre.v += 0.6; m.ceja.t = -8; m.cejaRot.t = -6; m.cejaArco.t = 0.35; m.sonrisa.t = 1; m.inferior.t = 0.2; }],
      [2700, () => { m.sonrisa.t = 0; m.inferior.t = 0; }],
    ] },
    rubor: { dur: 3000, peso: 2, pasos: [
      [0, () => { mirarSuave(-9, 8); m.inferior.t = 0.3; m.cabezaR.t = -5; m.ceja.t = -4; m.cejaRot.t = -8; m.cejaArco.t = 0.15; m.bocaMini.t = 1; m.pupila.t = 1.1; }],
      [2400, () => { mirarSuave(0, 0); m.bocaMini.t = 0; m.cabezaR.t = 0; }],
    ] },
    estrellitas: { dur: 2600, peso: 2, pasos: [
      [0, () => { m.abre.t = 1.14; m.abre.v += 1; m.pupila.t = 1.3; m.ceja.t = -10; m.ceja.v -= 50; m.cejaArco.t = 0.4; m.sonrisa.t = 0.9; }],
      [2100, () => { m.abre.t = 1; m.pupila.t = 1; m.sonrisa.t = 0; }],
    ] },
    ladeo: { dur: 2800, peso: 3, pasos: [
      [0, () => { mirarSuave(7, -6); m.cabezaR.t = 9; m.cabezaX.t = 8; m.cejaDif.t = -6; m.cejaRot.t = 3; m.cejaArco.t = 0.15; }],
      [2200, () => { mirarSuave(0, 0); m.cabezaR.t = 0; m.cejaDif.t = 0; }],
    ] },
    saltito: { dur: 1700, peso: 2, pasos: [
      [0, () => { m.aplasta.t = 0.09; m.cabezaY.t = 5; m.ceja.t = 3; m.sonrisa.t = 1; m.inferior.t = 0.3; }],
      [180, () => { m.aplasta.t = 0; m.aplasta.v -= 2.6; m.cabezaY.t = 0; m.cabezaY.v -= 95; m.abre.v += 0.6; m.ceja.t = -8; m.ceja.v -= 90; m.cejaArco.t = 0.3; }],
      [620, () => { m.aplasta.v += 2.2; m.cabezaY.v -= 60; m.ceja.v -= 50; }],
      [1050, () => { m.aplasta.v += 1.2; }],
      [1300, () => { m.sonrisa.t = 0; m.inferior.t = 0; }],
    ] },
    // Comer (lo lanza la mascota al soltarle comida): abre la boca, mastica cinco veces con los mofletes
    // hinchándose y la cabeza botando, y acaba contento y sonrojado. Peso 0: no sale solo.
    comer: { dur: 3000, peso: 0, pasos: [
      [0, () => { m.bocaO.t = 1; m.abre.t = 1.08; m.ceja.t = -6; m.cejaArco.t = 0.25; m.pupila.t = 1.1; }],
      [450, () => { m.inferior.t = 0.5; m.abre.t = 1; m.ceja.t = -3; }],
      ...[450, 850, 1250, 1650, 2050].map((t, i) => [t, () => {
        m.bocaO.t = i % 2 ? 0.7 : 0.1;
        m.aplasta.v += 0.9;
        m.cabezaY.v -= 28;
        m.cabezaR.t = i % 2 ? 3 : -3;
      }]),
      [2400, () => { m.bocaO.t = 0; m.sonrisa.t = 1; m.cabezaR.t = 0; m.cabezaY.v -= 40; m.ceja.v -= 40; }],
      [2800, () => { m.sonrisa.t = 0; m.inferior.t = 0; m.ceja.t = 0; m.cejaArco.t = 0; m.pupila.t = 1; }],
    ] },
    // Beber: echa la cabeza atrás, traga cinco veces (la boca pequeña sube y baja) y acaba con un «ahh» contento.
    beber: { dur: 3000, peso: 0, pasos: [
      [0, () => { m.cabezaR.t = -5; m.cabezaY.t = 6; m.inferior.t = 0.4; m.ceja.t = -4; m.bocaMini.t = 0.6; }],
      ...[450, 850, 1250, 1650, 2050].map((t, i) => [t, () => {
        m.bocaMini.t = i % 2 ? 0.2 : 1;
        m.cabezaY.v += 22;
        m.aplasta.v += 0.5;
      }]),
      [2400, () => { m.bocaMini.t = 0; m.cabezaR.t = 0; m.cabezaY.t = 0; m.sonrisa.t = 1; m.cabezaY.v -= 40; m.ceja.v -= 40; }],
      [2800, () => { m.sonrisa.t = 0; m.inferior.t = 0; m.ceja.t = 0; }],
    ] },
    // Jugar: ojos de estrella, mira el juguete y da tres saltitos con la cabeza.
    jugar: { dur: 2800, peso: 0, pasos: [
      [0, () => { m.abre.t = 1.12; m.pupila.t = 1.25; m.ceja.t = -8; m.cejaArco.t = 0.35; m.sonrisa.t = 1; m.inferior.t = 0.25; }],
      ...[300, 900, 1500].map((t) => [t, () => {
        m.aplasta.t = 0.07;
        setTimeout(() => { m.aplasta.t = 0; m.aplasta.v -= 2.4; m.cabezaY.v -= 80; m.ceja.v -= 60; }, 140);
      }]),
      [2300, () => { m.abre.t = 1; m.pupila.t = 1; m.ceja.t = 0; m.cejaArco.t = 0; m.sonrisa.t = 0; m.inferior.t = 0; }],
    ] },
    sorpresa: { dur: 1800, peso: 1, pasos: [
      [0, () => { m.abre.t = 1.16; m.abre.v += 1.6; m.ceja.t = -14; m.ceja.v -= 80; m.cejaArco.t = 0.5; m.bocaO.t = 1; m.pupila.t = 0.8; m.cabezaY.v -= 45; }],
      [1300, () => { m.abre.t = 1; m.ceja.t = 0; m.bocaO.t = 0; m.pupila.t = 1; }],
    ] },
    musica: { dur: 4800, peso: 1, pasos: [
      [0, () => { m.inferior.t = 0.4; m.sonrisa.t = 1; m.ceja.t = -5; m.cejaRot.t = -3; m.cejaArco.t = 0.2; }],
      ...[0, 600, 1200, 1800, 2400, 3000, 3600].map((t, i) => [t, () => {
        const lado = i % 2 ? 1 : -1;
        m.cabezaR.t = 6 * lado;
        m.cabezaX.t = 5 * lado;
        m.ceja.v -= 30; // las cejas también siguen el ritmo
      }]),
      [4200, () => { m.cabezaR.t = 0; m.cabezaX.t = 0; m.sonrisa.t = 0; m.inferior.t = 0; }],
    ] },
    // ── Reloj: se duerme antes de que salte y se despierta al volver (peso 0) ──
    // Lo lanza el kiosko (window.kaitoDormirse); al cerrar los ojos, al reloj.
    // Quedarse dormido, en continuo: el párpado de arriba baja poco a poco, cada
    // parpadeo es más lento y largo, la cabeza se va venciendo y al final los
    // ojos se cierran del todo, muy despacio. Luego duerme 15 s con zZz y, reloj.
    dormirse: { dur: DORMIRSE_MS + 3000, peso: 0, alTocar: despertar, pasos: [
      [0, () => mirarSuave(0, 3)],
      // Tres parpadeos, cada uno más lento: [cuándo, cuánto más lento]
      ...[[2200, 1.4], [5800, 2.2], [9200, 3]]
        .map(([t, lento]) => [t, () => { parpadearConSueno(lento); m.ceja.v -= 18; }]), // las cejas intentan abrir los ojos
      [DORMIRSE_MS, () => { const ir = alDormirse; alDormirse = null; if (ir) ir(); }],
    ], cadaCuadro(t) {
      if (face.classList.contains("despierta")) return; // lo han despertado
      const d = acotar(t / CAE_MS, 0, 1);
      const e = d * d * (3 - 2 * d); // empieza y acaba suave
      m.parpado.t = t < CAE_MS ? 0.72 * e : 0.72 + 0.28 * acotar((t - CAE_MS) / CIERRA_MS, 0, 1);
      m.inferior.t = 0.15 * e;
      m.ceja.t = 3 * e;
      m.cejaRot.t = -3 * e;
      m.cejaArco.t = -0.25 * e;
      m.cabezaY.t = 7 * e;
      m.cabezaR.t = -5 * e;
      m.bocaMini.t = acotar((t - CAE_MS * 0.6) / (CAE_MS * 0.4), 0, 1);
      respiraExtra = 1.6 * e;
    } },
    despertando: { dur: 2400, peso: 0, pasos: [
      [0, () => { m.parpado.x = m.parpado.t = 1; m.cabezaY.x = m.cabezaY.t = 6; m.bocaMini.x = m.bocaMini.t = 1; }],
      [800, despertar],
      [1200, () => { m.bocaO.t = 0; parpadear(); }],
      [1600, () => parpadear()],
    ] },

    // ── Los dos de tocar la pantalla (nunca salen solos: peso 0) ──
    // Caricia: deslizar el dedo por la cara. Ojos contentos y se arrima a la mano.
    caricia: { dur: 2200, peso: 0, pasos: [
      [0, () => { m.inferior.t = 0.45; m.sonrisa.t = 0.8; m.ceja.t = -5; m.cejaRot.t = -6; m.cejaArco.t = 0.25; m.pupila.t = 1.15; m.cabezaY.t = 3; }],
    ] },
    // Mantener pulsado: cosquillas. Se ríe mientras sigas; al soltar se calma.
    cosquillas: { dur: 6000, peso: 0, pasos: [
      [0, () => { m.inferior.t = 0.5; m.ceja.t = -6; m.cejaRot.t = -5; m.cejaArco.t = 0.3; m.pupila.t = 1.1; m.abre.v += 0.8; }],
    ], cadaCuadro(t) {
      if (gesto.soltado) return;
      const s = t / 1000;
      m.cabezaR.t = 4.5 * Math.sin(s * 16);
      m.cabezaY.t = -2.5 * Math.abs(Math.sin(s * 11));
      m.sonrisa.t = 0.7 + 0.4 * Math.abs(Math.sin(s * 11)); // "ja, ja, ja"
      m.ceja.t = -6 - 3 * Math.abs(Math.sin(s * 11));
    } },
    // Le han mandado callar tocando: mira cómo se cierra la cremallera de la boca y
    // dice "mm-mm" con cara de culpable. La cremallera es CSS (.gesto-cremallera):
    // cierra entre el 10 % y el 35 % de los 2,8 s, y aquí la mirada la sigue.
    cremallera: { dur: 2800, peso: 0, pasos: [
      [0, () => { mirarSuave(-11, 9); m.bocaMini.t = 0.6; m.ceja.t = -6; m.cejaRot.t = -8; m.cejaArco.t = 0.15; m.abre.v += 0.5; m.cabezaY.v -= 18; }],
      [1000, () => { mirarSuave(0, -1); parpadear(); m.bocaMini.t = 0; m.inferior.t = 0.3; m.ceja.t = -10; m.ceja.v -= 40; m.aplasta.v += 1.2; }],
      [1300, () => { m.cabezaR.t = -5; m.cabezaX.t = -4; }],
      [1560, () => { m.cabezaR.t = 5; m.cabezaX.t = 4; }],
      [1820, () => { m.cabezaR.t = -3; m.cabezaX.t = -2; }],
      [2080, () => { m.cabezaR.t = 0; m.cabezaX.t = 0; }],
    ], cadaCuadro(t) {
      if (t < 280 || t > 980) return;
      m.miradaX.t = miradaBase.x = -11 + (22 * (t - 280)) / 700;
    } },
    apuro: { dur: 3000, peso: 1, pasos: [
      [0, () => { mirarSuave(-12, 0); m.cejaRot.t = -12; m.cejaArco.t = 0.2; m.ceja.t = -5; m.bocaMini.t = 0.8; }],
      [1100, () => mirarSuave(12, 0)],
      [2100, () => mirarSuave(0, 0)],
      [2500, () => { m.cejaRot.t = 0; m.cejaArco.t = 0; m.ceja.t = 0; m.bocaMini.t = 0; }],
    ] },
  };

  // `quieto`: ms que lleva sin que nadie le hable ni lo toque
  function sortearKawaii() {
    const lista = Object.entries(KAWAII).map(([n, g]) => [n, g.peso]);
    let r = Math.random() * lista.reduce((a, [, p]) => a + p, 0);
    for (const [n, p] of lista) if ((r -= p) < 0) return n;
    return "feliz";
  }

  // Lanza un gesto si está en reposo. Devuelve true si lo ha hecho.
  function hacerGesto(nombre, forzar = false) {
    const g = KAWAII[nombre];
    if (!g || (estado !== "idle" && !forzar)) return false;
    terminarGesto();
    prox.finGesto = 0;
    aplicarModo();
    face.style.setProperty("--gesto-dur", g.dur + "ms");
    void face.offsetWidth; // reinicia los adornos si se repite el mismo
    face.classList.add("gesto-" + nombre);
    gesto = { nombre, g, ini: ahora, fin: ahora + g.dur, i: 0 };
    prox.gesto = gesto.fin + entre(CADA_GESTO);
    correrGesto(); // el primer paso, ya: el cuadro siguiente puede llevar una marca de tiempo anterior
    return true;
  }

  function correrGesto() {
    const pasos = gesto.g.pasos;
    const t = ahora - gesto.ini;
    while (gesto && gesto.i < pasos.length && pasos[gesto.i][0] <= t) pasos[gesto.i++][1]();
    if (gesto && gesto.g.cadaCuadro) gesto.g.cadaCuadro(t);
    if (gesto && ahora >= gesto.fin) {
      terminarGesto();
      prox.mirada = ahora + azar(600, 1500);
      prox.parpadeo = ahora + azar(700, 2000);
    }
  }

  function terminarGesto() {
    alDormirse = null; // si le hablan mientras se duerme, ya no salta al reloj
    if (!gesto) return;
    face.classList.remove("gesto-" + gesto.nombre, "despierta");
    gesto = null;
    vuelveAlReposo();
  }

  // ── Aro de escucha ──────────────────────────────────────────────────────────
  // Una línea turquesa de radio 222 que se ondula con el volumen (llega a saltos, ~16/s, y se suaviza).
  // Repintar el trazo cuesta en la Pi: se hace cada 50 ms y solo si suena algo; en silencio es un círculo quieto.
  const aro = document.getElementById("aroEscucha");
  const aroOnda = aro.firstElementChild;
  const ARO_R = 222, ARO_N = 96, ARO_AMP = 9; // cerca del borde: 222 + 9*1,4 (suma máxima de las tres ondas) = 234,6 < 240
  const ARO_SIN = Array.from({ length: ARO_N + 1 }, (_, i) => Math.sin(i / ARO_N * 2 * Math.PI));
  const ARO_COS = Array.from({ length: ARO_N + 1 }, (_, i) => Math.cos(i / ARO_N * 2 * Math.PI));
  const ARO_QUIETO = "M" + [...ARO_SIN.keys()].map((i) => (240 + ARO_R * ARO_SIN[i]).toFixed(1) + " " + (240 - ARO_R * ARO_COS[i]).toFixed(1)).join("L") + "Z";
  aroOnda.setAttribute("d", ARO_QUIETO);
  let nivelObj = 0, nivelSuave = 0, aroT = 0, aroPintado = 0, aroQuieto = true;
  socket.on("nivel_micro", (data) => { nivelObj = acotar(+(data && data.n) || 0, 0, 1); });
  function pintarAro(dt, ms) {
    nivelSuave += (nivelObj - nivelSuave) * Math.min(1, dt * (nivelObj > nivelSuave ? 18 : 7));
    aroT += dt;
    if (nivelSuave < 0.02) { // en silencio, círculo quieto (una sola vez)
      if (!aroQuieto) { aroOnda.setAttribute("d", ARO_QUIETO); aroQuieto = true; }
      return;
    }
    if (ms - aroPintado < 50) return;
    aroPintado = ms; aroQuieto = false;
    const amp = nivelSuave * ARO_AMP;
    let d = "";
    for (let i = 0; i < ARO_N; i++) {
      const a = i / ARO_N * 2 * Math.PI;
      const o = 0.6 * Math.sin(7 * a + 3.2 * aroT) + 0.35 * Math.sin(11 * a - 4.4 * aroT) + 0.45 * Math.sin(4 * a + 1.7 * aroT);
      const r = ARO_R + amp * o;
      d += (i ? "L" : "M") + (240 + r * ARO_SIN[i]).toFixed(1) + " " + (240 - r * ARO_COS[i]).toFixed(1);
    }
    aroOnda.setAttribute("d", d + "Z");
  }

  // ── Bucle ───────────────────────────────────────────────────────────────────
  let previo = 0;
  // La respiración arranca en fase 0 en el primer cuadro: si cuenta desde que empezó a cargar la
  // página, en la Pi (que tarda) el primer cuadro sale hasta 2 px desplazado y salta
  let origenRespira = null;
  function cuadro(ms) {
    if (origenRespira === null) origenRespira = ms;
    const dt = acotar((ms - previo) / 1000, 0, 0.05);
    previo = ms;
    ahora = ms;
    comportamiento();

    // Pasos cortos: los muelles rígidos serían inestables con frames lentos
    const pasos = Math.ceil(dt * 240) || 1;
    const h = dt / pasos;
    for (let i = 0; i < pasos; i++) {
      for (const s of muelles) {
        s.v += (s.k * (s.t - s.x) - s.d * s.v) * h;
        s.x += s.v * h;
      }
    }

    const t = (ms - origenRespira) / 1000;
    const respira = Math.sin(t * 1.35) * 1.5 + Math.sin(t * 0.63) * 0.6;
    const parp = curvaParpadeo();
    const parpado = Math.max(acotar(m.parpado.x, 0, 1), acotar(m.cierre.x, 0, 1), parp);
    const inferior = Math.max(acotar(m.inferior.x, 0, 1), parp * 0.12);
    const enSensei = face.classList.contains("sensei");
    const mx = m.miradaX.x;
    const my = m.miradaY.x;

    const ap = acotar(m.aplasta.x, -0.16, 0.16);
    poner(face, "style", `translate(${f(m.cabezaX.x)}px,${f(m.cabezaY.x + m.agacha.x + m.serio.x + respira * (1 + respiraExtra) + m.boca.x * 1.2)}px) rotate(${f2(m.cabezaR.x)}deg) scale(${f2(1 + ap)},${f2(1 - ap)})`);

    for (const o of ojos) {
      if (o.sensei !== enSensei) continue;
      // Mismo vector en pantalla para los dos ojos: se deshace el giro de cada uno
      // y su espejo. El desplazamiento hacia la nariz es fijo: si cambia con la mirada,
      // se ve a los ojos corregirse y cada uno recorre una distancia distinta.
      const irisX = (mx * o.cos + my * o.sin) * o.espejo * o.escala - o.haciaNariz * (1 - MIRADA_HACIA_NARIZ);
      const irisY = (my * o.cos - mx * o.sin) * o.escala;
      poner(o.iris, "transform", `translate(${f(irisX)} ${f(irisY)})`);
      poner(o.pupila, "style", `scale(${f2(Math.max(0, m.pupila.x))})`);
      // El guiño cierra solo un ojo; al apretarlo sube también un poco el de abajo
      const cierra = acotar(o.derecho ? m.cierraDer.x : m.cierraIzq.x, 0, 1);
      poner(o.sup, "transform", `translate(0 ${f(o.recorrido * Math.max(parpado, cierra))})`);
      poner(o.inf, "transform", `translate(0 ${f(-o.recorridoInf * Math.max(inferior, cierra * 0.3))})`);
      poner(o.el, "style", `translate(${f(mx * 0.08)}px,${f(my * 0.08)}px) scale(${f2(m.abre.x)})`);
    }
    for (const c of cejas) {
      if (c.sensei !== enSensei) continue;
      const enfasis = c.lado < 0 ? m.enfasisIzq.x : m.enfasisDer.x;
      const y = m.ceja.x + m.cejaDif.x * c.lado + enfasis + my * 0.4 + parp * 3 + m.serio.x * 0.25;
      const arco = acotar(1 + m.cejaArco.x, 0.4, 1.9);
      poner(c.el, "style", `translate(${f(mx * 0.12)}px,${f(y)}px) rotate(${f2(m.cejaRot.x * -c.lado)}deg) scale(1,${f2(arco)})`);
    }
    const abierta = acotar(m.boca.x, 0, 1.1);
    const pesos = {
      sonrisa: acotar(m.sonrisa.x, 0, 1.1),
      o: acotar(m.bocaO.x, 0, 1.1),
      mini: acotar(m.bocaMini.x, 0, 1.1),
      triste: acotar(m.triste.x, 0, 1.1),
    };
    const ladoBoca = m.bocaX.x;
    let i = 0;
    poner(boca.path, "d", boca.cerrada.replace(NUM, () => {
      let v = boca.de[i] + (boca.a[i] - boca.de[i]) * abierta;
      for (const k in pesos) if (pesos[k]) v += (boca.formas[k][i] - boca.de[i]) * pesos[k];
      i++;
      return f(v);
    }));
    poner(boca.svg, "style", `translate(${f(mx * 0.2 + ladoBoca)}px,${f(my * 0.1)}px) rotate(${f2(ladoBoca * 0.6)}deg)`);
    pintarAro(dt, ms);
    requestAnimationFrame(cuadro);
  }

  // ── Emoción al hablar ───────────────────────────────────────────────────────
  // El backend manda "emocion" en cuanto tiene la respuesta (la saca de la
  // etiqueta [feliz] del LLM, core/emociones.py). Se guarda y se pone al
  // empezar a hablar; al terminar, vuelve al reposo.
  const EMOCIONES = {
    feliz: { inferior: 0.3, ceja: -5, rot: -3, arco: 0.25, sonrisa: 0.55, pupila: 1.1 },
    carino: { inferior: 0.32, ceja: -4, rot: -6, arco: 0.3, sonrisa: 0.5, pupila: 1.22, inclina: -4 },
    bromista: { dif: -13, arco: 0.25, inferior: 0.22, sonrisa: 0.65, inclina: 6, alFinal: "guino" },
    // Ojos enormes con pupila pequeña, cejas arriba, boca en O y respingo atrás
    sorpresa: { abre: 1.24, ceja: -20, arco: 0.5, pupila: 0.68, o: 0.6, agacha: -7, impulso: () => { m.abre.v += 1.6; m.ceja.v -= 90; m.agacha.v -= 60; } },
    // Cejas caídas por fuera, boca hacia abajo, cabeza gacha mirando al suelo, lagrimita
    triste: { ceja: 15, rot: -18, arco: -0.1, enfasis: 0.4, pupila: 1.3, inferior: 0.1, inclina: -5, triste: 1, agacha: 8, mira: [-3, 9] },
    // Una ceja arriba y otra abajo, mirada fija arriba a un lado y boca torcida
    pensativo: { dif: 10, rot: 4, arco: -0.15, enfasis: 0, inclina: 6, bocaX: 7, mini: 0.35, mira: [11, -9] },
  };
  let emocionPendiente = null;
  let emocionActual = null;

  function ponerEmocion(nombre) {
    const e = EMOCIONES[nombre];
    if (!e) return;
    emocionActual = nombre;
    face.classList.add("emocion-" + nombre);
    if (e.inferior != null) m.inferior.t = e.inferior;
    if (e.ceja != null) m.ceja.t = e.ceja;
    if (e.dif != null) m.cejaDif.t = e.dif;
    if (e.rot != null) m.cejaRot.t = e.rot;
    if (e.arco != null) m.cejaArco.t = e.arco;
    if (e.abre != null) { m.abre.t = e.abre; m.abre.v += 0.6; }
    if (e.pupila != null) m.pupila.t = e.pupila;
    if (e.sonrisa != null) m.sonrisa.t = e.sonrisa;
    if (e.inclina != null) m.cabezaR.t = e.inclina;
    if (e.triste != null) m.triste.t = e.triste;
    if (e.agacha != null) m.agacha.t = e.agacha;
    if (e.bocaX != null) m.bocaX.t = e.bocaX;
    if (e.o != null) m.bocaO.t = e.o;
    if (e.mini != null) m.bocaMini.t = e.mini;
    if (e.mira) mirarSuave(e.mira[0], e.mira[1]);
    if (e.impulso) e.impulso();
  }

  function quitarEmocion() {
    if (!emocionActual) return null;
    const alFinal = EMOCIONES[emocionActual].alFinal;
    face.classList.remove("emocion-" + emocionActual);
    emocionActual = null;
    return alFinal;
  }

  socket.on("emocion", (data) => {
    // Respuesta de un turno cancelado: que no se quede para el siguiente
    if (estado === "idle") {
      emocionPendiente = null;
      return;
    }
    emocionPendiente = data && EMOCIONES[data.emocion] ? data.emocion : null;
    if (estado === "speaking" && emocionPendiente && !emocionActual) {
      ponerEmocion(emocionPendiente);
      emocionPendiente = null;
    }
  });

  // ── Estados ─────────────────────────────────────────────────────────────────
  function aplicarEstado(nuevo) {
    if (!estados.includes(nuevo) || nuevo === estado) return;
    aro.classList.toggle("activo", nuevo === "listening");
    if (nuevo !== "listening") nivelObj = 0;
    if (nuevo !== "idle") ocultarResumen(); // si le hablan, la tarjeta se va
    // Ya se ha callado: lo que llegue por detrás no interrumpe la cremallera
    if (gesto && gesto.nombre === "cremallera" && (nuevo === "idle" || nuevo === "speaking")) {
      estados.forEach((e) => face.classList.remove(e));
      face.classList.add(nuevo);
      estado = nuevo;
      modo = MODOS[nuevo];
      quietoDesde = ahora;
      quitarEmocion();
      emocionPendiente = null;
      return;
    }
    terminarGesto();
    estados.forEach((e) => face.classList.remove(e));
    face.classList.add(nuevo);
    estado = nuevo;
    modo = MODOS[nuevo];
    prox.finGesto = 0;
    prox.mirada = 0; // mira a otro sitio al cambiar, como quien cambia de idea
    prox.parpadeo = ahora + entre(modo.cadaParpadeo);
    prox.gesto = ahora + entre(CADA_GESTO);
    quietoDesde = ahora;
    aplicarModo();
    const alFinal = quitarEmocion();
    if (nuevo === "speaking" && emocionPendiente) ponerEmocion(emocionPendiente);
    if (nuevo !== "thinking") emocionPendiente = null;
    // Remate al acabar de hablar (p. ej. un guiño tras una broma). En conversación
    // ya estará escuchando otra vez cuando le toque, y también se hace.
    if (alFinal && nuevo === "idle") {
      setTimeout(() => {
        if (estado === "idle" || estado === "listening") hacerGesto(alFinal, true);
      }, 350);
    }

    // Impulsos: la reacción que un valor de reposo no puede dar
    if (nuevo === "listening") {
      miradaBase.x = 0;
      miradaBase.y = 0;
      m.abre.v += 1.3;
      m.ceja.v -= 70;
    } else if (nuevo === "speaking" || nuevo === "thinking") {
      parpadear();
    } else if (nuevo === "happy") {
      m.cabezaY.v -= 32;
    } else if (nuevo === "error") {
      m.cabezaX.v += 55;
    }
  }

  socket.on("estado", (data) => aplicarEstado(data.estado));
  socket.on("boca", (data) => {
    // Al empezar una frase suele enfatizar con las cejas
    if (data.hablado && !hablando && Math.random() < 0.6) prox.enfasis = ahora + azar(80, 300);
    hablando = !!data.hablado;
  });

  // Al tocar la pantalla mira hacia el dedo, sin molestar al doble toque ni al cajón
  document.addEventListener(
    "pointerdown",
    (e) => {
      if (e.target.closest("#mascotaDrawer,#mascotaFondo")) return; // arrastrar comida: ni caricia ni calla a Kaito
      // En el robot, tocar mientras piensa o habla lo calla (_kiosko.html): la cremallera
      // sale ya. Ese toque no cuenta como caricia ni le hace mirar al dedo.
      if ({{ 'true' if es_kiosko else 'false' }} && (estado === "speaking" || estado === "thinking") && !e.target.closest("#kioskoDrawer,#kioskoBackdrop")) {
        quitarEmocion();
        emocionPendiente = null;
        hablando = false;
        hacerGesto("cremallera", true);
        return;
      }
      if (gesto && gesto.g.alTocar && !face.classList.contains("despierta")) {
        alDormirse = null; // tocarlo mientras se duerme cancela el reloj
        gesto.g.alTocar();
        gesto.i = gesto.g.pasos.length;
        gesto.fin = ahora + 900;
        return;
      }
      empezarToque(e);
      const r = face.getBoundingClientRect();
      mirar(
        acotar(((e.clientX - (r.left + r.width / 2)) / 180) * 16, -16, 16),
        acotar(((e.clientY - (r.top + r.height / 2)) / 180) * 11, -11, 11),
      );
      m.abre.v += 0.8;
      m.enfasisIzq.v -= 70;
      m.enfasisDer.v -= 70;
      prox.finDedo = ahora + 1300;
      prox.mirada = ahora + 1500;
      quietoDesde = ahora;
    },
    { passive: true },
  );

  // ── Caricia y mantener pulsado ──────────────────────────────────────────────
  // Siempre un solo toque: el doble toque es del reloj (_kiosko.html), y allí
  // un toque largo o arrastrado ya no cuenta para el doble toque.
  const toque = { activo: false, x0: 0, y0: 0, x: 0, y: 0, recorrido: 0, timer: 0, enCara: false };

  function dentroDeLaCara(x, y) {
    const r = face.getBoundingClientRect();
    return x > r.left - 30 && x < r.right + 30 && y > r.top - 30 && y < r.bottom + 30;
  }

  function empezarToque(e) {
    clearTimeout(toque.timer);
    toque.activo = true;
    toque.x0 = toque.x = e.clientX;
    toque.y0 = toque.y = e.clientY;
    toque.recorrido = 0;
    // Los 100 px de arriba son para abrir el cajón deslizando
    toque.enCara = e.clientY > 100 && dentroDeLaCara(e.clientX, e.clientY);
    if (!toque.enCara) return;
    toque.timer = setTimeout(() => {
      if (toque.activo && Math.hypot(toque.x - toque.x0, toque.y - toque.y0) < 18) hacerGesto("cosquillas");
    }, 600);
  }

  document.addEventListener(
    "pointermove",
    (e) => {
      if (!toque.activo || !toque.enCara) return;
      const dx = e.clientX - toque.x;
      toque.recorrido += Math.abs(dx);
      toque.x = e.clientX;
      toque.y = e.clientY;
      if (Math.hypot(toque.x - toque.x0, toque.y - toque.y0) > 18) clearTimeout(toque.timer);
      if (Math.abs(toque.y - toque.y0) > 90) return; // eso es arrastrar en vertical
      const enCaricia = gesto && gesto.nombre === "caricia";
      if (toque.recorrido > 90) {
        toque.recorrido = 0;
        if (enCaricia) gesto.fin = Math.max(gesto.fin, Math.min(gesto.ini + 7000, ahora + 1600));
        else if (!gesto || gesto.nombre !== "cosquillas") hacerGesto("caricia");
      }
      // Se arrima hacia donde va la mano
      if (enCaricia && Math.abs(dx) > 2) {
        m.cabezaR.t = 5 * Math.sign(dx);
        m.cabezaX.t = 4 * Math.sign(dx);
      }
    },
    { passive: true },
  );

  function soltarToque() {
    toque.activo = false;
    clearTimeout(toque.timer);
    if (gesto && gesto.nombre === "cosquillas" && !gesto.soltado) {
      gesto.soltado = true;
      gesto.fin = Math.min(gesto.fin, ahora + 700);
      m.cabezaR.t = 0;
      m.cabezaY.t = 0;
      m.sonrisa.t = 0.8;
    }
  }
  document.addEventListener("pointerup", soltarToque, { passive: true });
  document.addEventListener("pointercancel", soltarToque, { passive: true });

  const senseiJp = document.getElementById("sensei-jp");

  // Pizarra: la cara sube, la pizarra entra por abajo y el kana se escribe con tiza.
  // Al quitarla el texto se queda para que salga con ella.
  const pizarraTexto = senseiJp.querySelector(".pizarra-texto");
  const pTiza = senseiJp.querySelector(".pizarra-tiza");
  const pBorr = senseiJp.querySelector(".pizarra-borrador");
  const pVelo = senseiJp.querySelector(".pizarra-velo");
  // La letra de tiza se baja al abrir la cara: si no, la primera pizarra sale vacía un momento
  document.fonts.load('600 1em "Klee One"', "あいうえおかきくけこアイウエオ").catch(() => {});

  // Estado de la animación: filas = animaciones de recorte (al cancelar se congelan donde
  // estén), otras = tiza, borrador, velo y polvo
  const P = { firma: "", filas: [], otras: [], timers: [], polvo: 0 };
  const PAUSA = ",.;:、。 ";
  // Cada fila es fila > ventana > texto. Revelar = deslizar la ventana (que recorta) hacia la
  // derecha y el texto hacia la izquierda lo mismo: el texto no se mueve y la ventana lo va
  // descubriendo. Solo transform, así corre en el compositor y no gasta hilo principal
  // (con clip-path o máscaras la Pi repintaba la fila en cada cuadro). p: 1 = oculta, 0 = a la vista.
  const pVent = (f) => f.firstChild;
  const pTx = (f) => f.firstChild.firstChild;
  const pDesliza = (p, W) => `translateX(${(-p * W).toFixed(1)}px)`; // la ventana usa p; el texto, -p
  const pAnim = (el, kf, op, lista = P.otras) => {
    const a = el.animate(kf, { fill: "both", ...op });
    lista.push(a);
    return a;
  };

  // Grano de tiza: dos mosaicos de motas (blanco y amarillo pálido) generados una sola vez.
  // Un canvas pequeño sale mucho más barato que un filtro SVG en la Pi.
  (function () {
    const c = document.createElement("canvas");
    c.width = c.height = 96;
    const cx = c.getContext("2d");
    const img = cx.createImageData(96, 96);
    const mosaico = (r, g, b) => {
      for (let i = 0; i < img.data.length; i += 4) {
        img.data[i] = r;
        img.data[i + 1] = g;
        img.data[i + 2] = b;
        img.data[i + 3] = Math.random() < 0.2 ? 70 : 255;
      }
      cx.putImageData(img, 0, 0);
      return `url("${c.toDataURL()}")`;
    };
    senseiJp.style.setProperty("--grano", mosaico(244, 241, 230));
    senseiJp.style.setProperty("--grano-es", mosaico(219, 208, 147));
  })();

  // Seis motitas de polvo que se reutilizan en cada escritura (nada de crear y borrar nodos)
  const pPolvos = Array.from({ length: 6 }, () => {
    const d = document.createElement("i");
    d.className = "polvo";
    senseiJp.appendChild(d);
    return d;
  });

  function pCancelar() {
    P.timers.forEach(clearTimeout);
    P.timers = [];
    for (const a of P.filas) {
      try { a.commitStyles(); } catch (e) {}
      a.cancel();
    }
    P.otras.forEach((a) => a.cancel());
    P.filas = [];
    P.otras = [];
    P.polvo = 0;
  }

  // Lista de hasta 3 elementos: string (kana) u objeto {jp, es}
  function pItems(frases) {
    return frases
      .slice(0, 3)
      .map((f) => (typeof f === "string" ? { jp: f } : { jp: String((f && f.jp) || ""), es: f && f.es ? String(f.es) : "" }))
      .filter((i) => i.jp.trim());
  }

  // Una fila por kana (las largas se parten por las comas, para no cortar una palabra) y una
  // pequeña debajo con el significado
  function pConstruir(items) {
    pizarraTexto.textContent = "";
    const fila = (t, cls) => {
      const d = document.createElement("div");
      d.className = "fila " + cls;
      const v = document.createElement("div");
      v.className = "vent";
      const x = document.createElement("div");
      x.className = "tx";
      x.textContent = t;
      v.appendChild(x);
      d.appendChild(v);
      pizarraTexto.appendChild(d);
      return d;
    };
    const filas = [];
    for (const it of items) {
      const partes = it.jp.length > 10 ? it.jp.split(/(?<=[、。])/) : [it.jp];
      partes.forEach((p) => filas.push(fila(p.trim(), "jp")));
      if (it.es) filas.push(fila(it.es, "es"));
    }
    return filas;
  }

  // La letra más grande con la que cada fila cabe dentro del círculo (con margen) una vez
  // la pizarra esté arriba; se mide con ella aún escondida, restando su posición
  function pAjustar(filas) {
    const larga = filas.length > 2 || filas.some((f) => f.classList.contains("jp") && f.textContent.length > 8);
    senseiJp.classList.toggle("larga", larga);
    face.classList.toggle("pizarra-larga", larga);
    const W = innerWidth, H = innerHeight, R = Math.min(W, H) / 2 - 10;
    const cabe = () => {
      const pr = senseiJp.getBoundingClientRect();
      const top = H - senseiJp.offsetHeight;
      return filas.every((f) => {
        const r = f.getBoundingClientRect();
        const y0 = top + r.top - pr.top, y1 = top + r.bottom - pr.top;
        const dy = Math.max(Math.abs(y0 - H / 2), Math.abs(y1 - H / 2));
        if (y0 < top + 12 || dy >= R) return false;
        const hw = Math.sqrt(R * R - dy * dy);
        return r.left - pr.left >= W / 2 - hw && r.right - pr.left <= W / 2 + hw;
      });
    };
    // Búsqueda binaria entre 16 y 64 px (de 2 en 2): cabe() es monótona, y probar los 25
    // tamaños uno a uno eran 25 layouts seguidos (medio segundo de bloqueo en la Pi, y cada
    // tamaño deja entradas en las cachés de tipografía)
    const poner = (k) => {
      const tam = 16 + 2 * k;
      for (const f of filas) f.style.fontSize = (f.classList.contains("es") ? Math.max(11, Math.round(tam * 0.36)) : tam) + "px";
    };
    let lo = 0, hi = 24;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      poner(mid);
      if (cabe()) lo = mid;
      else hi = mid - 1;
    }
    poner(lo);
  }

  // Escribe las filas una a una. t0 = segundos hasta que la tiza sale de la repisa
  function pEscribir(filas, t0) {
    const pr = senseiJp.getBoundingClientRect();
    const rest = { x: senseiJp.offsetWidth * 0.62, y: -14 };
    const tr = (x, y, r = -35) => `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${r.toFixed(1)}deg)`;
    pTiza.style.transform = tr(rest.x, rest.y);
    const track = [{ t: 0, x: rest.x, y: rest.y, e: "ease-in-out" }];
    let t = t0, cur = rest, puffs = 0;
    const rg = document.createRange();
    // Con mucho texto la tiza va más deprisa: que no tarde más de ~5 s (Kaito ya ha acabado de hablar)
    const largo = filas.reduce((s, f) => s + f.textContent.length * (f.classList.contains("es") ? 0.045 : 0.15), 0);
    const prisa = Math.min(1, 5 / largo);
    filas.forEach((f, fi) => {
      const nodo = pTx(f).firstChild, fr = f.getBoundingClientRect(), W = fr.width;
      const es = f.classList.contains("es"), paso = (es ? 0.045 : 0.15) * prisa, txt = nodo.data;
      const pos = []; // x del final de cada carácter y y de su línea de escritura
      for (let i = 0; i < txt.length; i++) {
        rg.setStart(nodo, i);
        rg.setEnd(nodo, i + 1);
        const b = rg.getBoundingClientRect();
        pos.push({ x: b.right - fr.left, y: b.top + b.height * 0.6 - pr.top, ini: b.left - fr.left });
      }
      // La tiza viaja desde donde esté hasta el principio de la fila
      const a0 = { x: fr.left - pr.left + pos[0].ini, y: pos[0].y };
      track.push({ t, x: cur.x, y: cur.y, e: "ease-in-out" });
      t += fi === 0 ? 0.4 : 0.28;
      track.push({ t, x: a0.x, y: a0.y, e: "linear" });
      const ini = t;
      const edge = (x) => Math.max(0, 1 - x / W); // fracción de la fila que aún queda oculta
      const mk = [{ t: 0, p: 1 }];
      const dust = es ? 8 : 3;
      pos.forEach((c, i) => {
        t += paso;
        const dx = fr.left - pr.left + c.x;
        track.push({ t, x: dx, y: c.y + (Math.random() - 0.5) * 2.4, r: -35 + (Math.random() - 0.5) * 8, e: "linear" }); // temblor
        mk.push({ t: t - ini, p: edge(c.x) });
        if (PAUSA.includes(txt[i])) {
          t += 0.12;
          track.push({ t, x: dx, y: c.y, e: "linear" });
          mk.push({ t: t - ini, p: edge(c.x) });
        }
        if (i % dust === 1 && puffs++ < pPolvos.length) pPolvo(dx, c.y + 5, t);
      });
      const dur = t - ini;
      // Oculta hasta que le toque; su animación se crea entonces
      const v = pVent(f), x = pTx(f);
      v.style.transform = pDesliza(1, W);
      x.style.transform = pDesliza(-1, W);
      const op = { duration: dur * 1000, easing: "linear" };
      P.timers.push(setTimeout(() => {
        const a = pAnim(v, mk.map((k) => ({ offset: k.t / dur, transform: pDesliza(k.p, W) })), op, P.filas);
        pAnim(x, mk.map((k) => ({ offset: k.t / dur, transform: pDesliza(-k.p, W) })), op, P.filas);
        a.onfinish = () => {
          v.style.transform = x.style.transform = "none";
          P.filas.forEach((b) => (b.effect.target === v || b.effect.target === x) && b.cancel());
          P.filas = P.filas.filter((b) => b.effect.target !== v && b.effect.target !== x);
        };
      }, ini * 1000));
      cur = track[track.length - 1];
    });
    // Al terminar la tiza vuelve a la repisa
    track.push({ t: t + 0.2, x: cur.x, y: cur.y, e: "ease-in-out" });
    track.push({ t: t + 0.65, x: rest.x, y: rest.y, e: "linear" });
    const total = t + 0.65;
    pAnim(pTiza, track.map((k) => ({ offset: Math.min(1, k.t / total), transform: tr(k.x, k.y, k.r), easing: k.e })), { duration: total * 1000, easing: "linear" });
  }

  function pPolvo(x, y, t) {
    const d = pPolvos[P.polvo++ % pPolvos.length];
    const dx = (Math.random() - 0.5) * 14;
    pAnim(d, [
      { opacity: 0.85, transform: `translate(${x}px, ${y}px)` },
      { opacity: 0, transform: `translate(${x + dx}px, ${y + 14 + Math.random() * 10}px)` },
    ], { delay: t * 1000, duration: 650 + Math.random() * 300, easing: "ease-in", fill: "none" });
  }

  // Un borrador barre cada fila de derecha a izquierda; el texto se borra a su paso y queda
  // un velo de tiza que se desvanece. Devuelve cuántos segundos dura el barrido.
  function pBorrar() {
    const pr = senseiJp.getBoundingClientRect();
    const filas = [...pizarraTexto.children];
    const W = senseiJp.offsetWidth;
    const track = [];
    let t = 0.05, x0 = 1e9, x1 = 0, y0 = 1e9, y1 = 0;
    filas.forEach((f, i) => {
      const r = f.getBoundingClientRect();
      const L = r.left - pr.left - 12, Rr = r.right - pr.left + 12, cy = r.top + r.height / 2 - pr.top;
      x0 = Math.min(x0, L); x1 = Math.max(x1, Rr); y0 = Math.min(y0, r.top - pr.top); y1 = Math.max(y1, r.bottom - pr.top);
      if (i === 0) track.push({ t, x: W + 40, y: cy });
      track.push({ t: (t += 0.2), x: Rr, y: cy });
      const dur = 0.25 + r.width / 650;
      // Desde donde esté ahora (la fila puede estar a medio escribir) hasta oculta, por la derecha
      const v = pVent(f), x = pTx(f), Wf = r.width;
      const cur = new DOMMatrix(getComputedStyle(v).transform).m41; // 0 = a la vista, -Wf = oculta
      const op = { delay: t * 1000, duration: dur * 1000, easing: "linear" };
      pAnim(v, [{ transform: `translateX(${cur}px)` }, { transform: pDesliza(1, Wf) }], op, P.filas);
      pAnim(x, [{ transform: `translateX(${-cur}px)` }, { transform: pDesliza(-1, Wf) }], op, P.filas);
      // Zigzag: sube y baja un poco mientras barre
      for (let k = 1; k <= 3; k++) track.push({ t: t + (dur * k) / 3, x: Rr + (L - Rr) * (k / 3), y: cy + (k % 2 ? -6 : 6) });
      t += dur;
    });
    track.push({ t: t + 0.25, x: W + 40, y: track[track.length - 1].y });
    const total = t + 0.25;
    pAnim(pBorr, track.map((k, i) => ({ offset: k.t / total, opacity: i === 0 || i === track.length - 1 ? 0 : 1, transform: `translate(${(k.x - 29).toFixed(1)}px, ${(k.y - 13).toFixed(1)}px)` })), { duration: total * 1000, easing: "linear", fill: "none" });
    Object.assign(pVelo.style, { left: x0 - 8 + "px", top: y0 - 6 + "px", width: x1 - x0 + 16 + "px", height: y1 - y0 + 12 + "px" });
    const fin = total + 0.8;
    pAnim(pVelo, [{ opacity: 0, offset: 0 }, { opacity: 0.55, offset: t / fin }, { opacity: 0, offset: 1 }], { duration: fin * 1000, easing: "ease-out", fill: "none" });
    return t;
  }

  function mostrarJaponesSensei(frases) {
    const items = frases && frases.length ? pItems(frases) : [];
    const firma = JSON.stringify(items);
    if (items.length && hayPizarra && firma === P.firma) return; // el mismo texto: nada que hacer
    const habia = hayPizarra && pizarraTexto.childElementCount > 0;
    pCancelar();
    hayPizarra = items.length > 0;
    P.firma = hayPizarra ? firma : "";
    senseiJp.classList.toggle("visible", hayPizarra);
    face.classList.toggle("con-pizarra", hayPizarra);
    if (!hayPizarra) return mirar(0, 0);
    const empezar = (t0) => {
      const filas = pConstruir(items);
      pAjustar(filas);
      pEscribir(filas, t0);
    };
    if (habia) P.timers.push(setTimeout(() => empezar(0.1), (pBorrar() + 0.35) * 1000));
    else empezar(0.7); // la pizarra aún está subiendo
    // Mira a la pizarra en cuanto aparece
    mirar(azar(-2, 2), MIRA_PIZARRA);
    prox.mirada = ahora + 2500;
  }

  socket.on("sensei_japones", (data) => mostrarJaponesSensei(data.frases));

  // Resumen de la clase (sensei_resumen llega al salir, antes de modo_sensei false). null = la
  // sesión no se cerró despidiéndose (inactividad): no hay celebración.
  const resumenEl = document.getElementById("resumenClase");
  let resumenClase = null, resumenTimer = 0;
  socket.on("sensei_resumen", (data) => { resumenClase = data || {}; });
  function ocultarResumen() {
    clearTimeout(resumenTimer);
    resumenEl.classList.remove("visible");
  }
  // Al acabar la transición de salida: estrellitas y, si hubo algo, la tarjeta unos 6,5 s
  function celebrar() {
    const r = resumenClase;
    resumenClase = null;
    if (!r) return;
    hacerGesto("estrellitas");
    const logros = r.logros || [], pals = r.palabras || [];
    if (!logros.length && !pals.length) return;
    // Dos líneas para no tapar la boca: «¡Buena clase! ✓ 2» y las palabras que quepan en una (≤ 12 kana)
    const tit = resumenEl.querySelector(".rc-tit");
    tit.textContent = r.titulo || "¡Buena clase!";
    if (logros.length) tit.append(Object.assign(document.createElement("b"), { textContent: "✓ " + logros.length }));
    let caben = 12;
    const enLinea = pals.filter((p) => (caben -= p.jp.length) >= 0);
    resumenEl.querySelector(".rc-pals").replaceChildren(...enLinea.map((p) =>
      Object.assign(document.createElement("span"), { textContent: p.jp })));
    clearTimeout(resumenTimer);
    resumenTimer = setTimeout(() => {
      resumenEl.classList.add("visible");
      resumenTimer = setTimeout(ocultarResumen, 6500);
    }, 500);
  }

  // Quita o deja las que no gusten: se elige una al azar cada vez
  const CAMBIOS_SENSEI = ["pincel", "shoji", "petalos", "humo"];
  window.kaitoCambiarSensei = (activo, tipo) => {
    const cambiar = () => {
      face.classList.toggle("sensei", activo);
      if (!activo) mostrarJaponesSensei(null);
    };
    if (activo) { resumenClase = null; ocultarResumen(); }
    if (face.classList.contains("sensei") === activo) return cambiar();
    const elegido = tipo || CAMBIOS_SENSEI[Math.floor(Math.random() * CAMBIOS_SENSEI.length)];
    const tapar = () => Promise.resolve(window.KaitoTransicion ? window.KaitoTransicion.tapar(elegido, cambiar) : cambiar())
      .then(() => { if (!activo) celebrar(); });
    // Al salir con la pizarra puesta: baja, la cara vuelve (~0.75 s) y solo entonces empieza la transición
    if (!activo && hayPizarra) {
      mostrarJaponesSensei(null);
      setTimeout(tapar, 750);
    } else tapar();
  };
  socket.on("modo_sensei", (data) => window.kaitoCambiarSensei(!!data.activo));
  // Al decir que sale: la pizarra baja y la cara vuelve al frente, sin cambiar de cara. Kaito
  // se despide así, con la cara sensei, y solo después llega modo_sensei false (la animación)
  socket.on("sensei_pizarra_fuera", () => mostrarJaponesSensei(null));

  // De dónde parte la capa de la transición, para que no se note cuándo aparece
  function poseCara(dormido) {
    const [, x, y, r] = face.style.transform.match(/translate\((-?[\d.]+)px, *(-?[\d.]+)px\) rotate\((-?[\d.]+)deg/) || [0, 0, 0, 0];
    return { x: +x, y: +y, r: +r, dormido, mini: dormido };
  }
  // Al reloj se llega con los ojos cerrados: dormido, o los cierra ahora si ha sido un
  // doble toque. Con las piezas de sensei, sin transición: la capa dibuja la cara normal.
  window.kaitoIrAlReloj = (ir, tipo) => {
    if (!window.KaitoTransicion || face.classList.contains("sensei")) return ir();
    const dormido = !!gesto && gesto.nombre === "dormirse" && !face.classList.contains("despierta");
    if (!dormido) m.cierre.t = 1;
    setTimeout(() => window.KaitoTransicion.aReloj({ pose: poseCara(dormido), tipo }).then(ir), dormido ? 0 : 500);
  };

  // Muestra en pantalla lo que Kaito ha entendido tras el wakeword
  socket.on("transcripcion", function (data) {
    const respuestaDiv = document.getElementById("respuesta");
    respuestaDiv.style.display = "block";
    respuestaDiv.textContent = `📝 "${data.texto}"`;
  });

  ahora = previo = quietoDesde = performance.now();

  // El kiosko lo llama antes de saltar al reloj: se duerme y, al cerrar los ojos,
  // `irAlReloj()`. Si no puede (no está en reposo), salta directamente.
  window.kaitoDormirse = (irAlReloj) => {
    if (!hacerGesto("dormirse")) return irAlReloj();
    alDormirse = irAlReloj;
  };
  // Y lo cancela si hay actividad mientras se duerme (tecla, estado...): se despierta
  window.kaitoCancelarDormirse = () => {
    if (!gesto || gesto.nombre !== "dormirse" || face.classList.contains("despierta")) return;
    alDormirse = null;
    despertar();
    gesto.i = gesto.g.pasos.length;
    gesto.fin = ahora + 900;
  };
  prox.parpadeo = ahora + entre(modo.cadaParpadeo);
  prox.gesto = ahora + entre(CADA_GESTO);
  aplicarModo();
  // Si venimos del reloj (lo detecta face.html), abre los ojos despertándose.
  // Después de aplicarModo, que devolvería los párpados al reposo.
  if (document.documentElement.classList.contains("ojos-cerrados")) hacerGesto("despertando");
  requestAnimationFrame((ms) => {
    cuadro(ms);
    // Ya están puestos los párpados del motor: el CSS de arranque deja de hacer falta
    document.documentElement.classList.remove("ojos-cerrados");
    if (window.KaitoTransicion) window.KaitoTransicion.quitar();
  });

  // El backend puede pedir un gesto: socketio.emit("gesto", {"gesto": "corazones"})
  socket.on("gesto", (data) => hacerGesto(data && data.gesto));
  window.kaitoGesto = hacerGesto; // para probar desde la consola

  // Prueba rápida en la pantalla: /?gesto=corazones (o ?gesto=todos para verlos seguidos)
  (function () {
    const pedido = new URLSearchParams(location.search).get("gesto");
    if (!pedido) return;
    const lista = pedido === "todos" ? Object.keys(KAWAII) : [pedido];
    let i = 0;
    (function siguiente() {
      if (i >= lista.length) return;
      const nombre = lista[i++];
      hacerGesto(nombre);
      setTimeout(siguiente, ((KAWAII[nombre] || {}).dur || 0) + 900);
    })();
  })();
</script>
