<style>
  /* Paleta de la cara (ámbar, a juego con la carcasa #aa8d5f).
     Ajustar aquí viéndolo en la pantalla del robot: no da el mismo color que el plástico. */
  :root {
    --cara-fondo: #15100a;
    --cara-esclera: #fff3da;
    --cara-iris-claro: #f6c063;
    --cara-iris-oscuro: #8a5a1e;
    --cara-pupila: #1a1006;
    --cara-ceja-claro: #b98536;
    --cara-ceja-oscuro: #7a5220;
    --cara-boca-claro: #e0a44d;
    --cara-boca-oscuro: #8a5a1e;
    --cara-parpado: #4a3012;
    --cara-brillo: 224, 162, 74; /* canales RGB: se usa con rgba(var(--cara-brillo), alfa) */
    /* Halo: pantalla redonda de 480x480, tiene que quedar dentro y apenas notarse */
    --cara-halo-color: 150, 98, 36;
    --cara-halo-tamano: 360px;
    /* En el robot Chromium no baja de 500 px de ventana y la pantalla mide 480:
       sin esto la cara queda 10 px a la derecha. Sirve también para ajustar el centrado. */
    --cara-ancho: {{ '480px' if es_kiosko else '100vw' }};
  }
  .transition,
  .transition .eye,
  .transition .eyebrow,
  .transition .mouth,
  .transition .face {
    transition:
      transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1),
      filter 0.45s ease,
      opacity 0.45s ease;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--cara-fondo);
    width: var(--cara-ancho);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;   /* sin zoom por doble toque: el doble toque navega */
  }
  /* CARA (contenedor vertical) */
  .face {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    transition: 0.35s;
    animation: breathing 5s ease-in-out infinite;
  }

  /* Halo cálido detrás de la cara */
  .face::before {
    content: "";
    position: absolute;
    left: 50%; /* relativo a .face: su animación de transform la hace contenedor */
    top: 48%;
    transform: translate(-50%, -50%);
    z-index: -1;
    pointer-events: none;

    width: var(--cara-halo-tamano);
    height: var(--cara-halo-tamano);
    border-radius: 50%;

    background: radial-gradient(
      circle,
      rgba(var(--cara-halo-color), 0.4) 0%,
      rgba(var(--cara-halo-color), 0.24) 40%,
      rgba(var(--cara-halo-color), 0.1) 70%,
      transparent 100%
    );

    filter: blur(30px);

    animation: faceGlow 5.5s ease-in-out infinite;
  }

  @keyframes faceGlow {
    0%,
    100% {
      transform: translate(-50%, -50%) scale(0.97);
      opacity: 0.85;
      filter: blur(26px);
    }

    50% {
      transform: translate(-50%, -50%) scale(1.05);
      opacity: 1;
      filter: blur(34px);
    }
  }

  /* CEJAS */
  .eyebrows {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 170px; /* un poco más juntas */
    margin-bottom: 15px; /* más arriba */
    z-index: 2;
  }
  .eyebrow {
    width: 90px; /* un poco más pequeñas */
    height: auto;
    transition: 0.35s;
    transform-origin: center center;
  }

  /* OJOS */
  .eyes {
    display: flex;
    justify-content: center;
    gap: 70px; /* ojos más juntos para acompañar la rotación hacia dentro */
  }
  .eye {
    width: 150px;
    height: auto;
    transition: 0.35s;
    transform-origin: center center;
  }
  /* Rotación base: mirando hacia la nariz */
  .eye-left {
    rotate: 12deg;
  }
  .eye-right {
    rotate: -12deg;
  }

  /* BOCA */
  .mouth-container {
    margin-top: 20px;
    overflow: visible;
  }
  .mouth {
    overflow: visible;
    width: 90px;
    height: auto;
    transition: 0.35s;
    transform-origin: center center;
  }

  @keyframes breathing {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-2px);
    }
  }

  .eye,
  .eyebrow,
  .mouth,
  .face {
    transition:
      transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1),
      filter 0.45s ease,
      opacity 0.45s ease;
    will-change: transform;
  }

  /* IDLE */
  .idle .eye-left {
    animation: idleLeft 7s infinite ease-in-out;
  }
  .idle .eye-right {
    animation: idleRight 7s infinite ease-in-out;
  }
  @keyframes idleLeft {
    0%,
    100% {
      transform: translate(0, 0);
    }
    20% {
      transform: translate(-1px, -1px);
    }
    40% {
      transform: translate(1px, 0px);
    }
    60% {
      transform: translate(0px, 1px);
    }
    80% {
      transform: translate(-1px, 0px);
    }
  }

  @keyframes idleRight {
    0%,
    100% {
      transform: translate(0, 0);
    }
    20% {
      transform: translate(-1px, -1px);
    }
    40% {
      transform: translate(1px, 0px);
    }
    60% {
      transform: translate(0px, 1px);
    }
    80% {
      transform: translate(-1px, 0px);
    }
  }

  .eye.blink {
    animation: blink 0.14s ease;
  }

  @keyframes blink {
    0% {
      transform: scaleY(1);
    }
    45% {
      transform: scaleY(0.03);
    }
    100% {
      transform: scaleY(1);
    }
  }

  /* Keyframes de movimiento */
  @keyframes lookRight {
    0%,
    12% {
      transform: translateX(0);
    }
    22%,
    55% {
      transform: translateX(14px);
    }
    65%,
    100% {
      transform: translateX(0);
    }
  }
  @keyframes lookLeft {
    0%,
    12% {
      transform: translateX(0);
    }
    22%,
    55% {
      transform: translateX(-14px);
    }
    65%,
    100% {
      transform: translateX(0);
    }
  }
  @keyframes lookUp {
    0%,
    12% {
      transform: translateY(0);
    }
    22%,
    55% {
      transform: translateY(-10px);
    }
    65%,
    100% {
      transform: translateY(0);
    }
  }
  @keyframes browFrownLeft {
    0%,
    12% {
      transform: rotate(0deg);
    }
    22%,
    55% {
      transform: rotate(-9deg);
    }
    65%,
    100% {
      transform: rotate(0deg);
    }
  }
  @keyframes browFrownRight {
    0%,
    12% {
      transform: rotate(0deg);
    }
    22%,
    55% {
      transform: rotate(9deg);
    }
    65%,
    100% {
      transform: rotate(0deg);
    }
  }
  @keyframes browShiftRight {
    0%,
    12% {
      transform: translateX(0);
    }
    22%,
    55% {
      transform: translateX(10px);
    }
    65%,
    100% {
      transform: translateX(0);
    }
  }
  @keyframes browShiftLeft {
    0%,
    12% {
      transform: translateX(0);
    }
    22%,
    55% {
      transform: translateX(-10px);
    }
    65%,
    100% {
      transform: translateX(0);
    }
  }
  @keyframes mouthSearch {
    0%,
    12% {
      transform: translateX(0) translateY(0);
    }
    22%,
    55% {
      transform: translateX(var(--mouth-x, 0px)) translateY(var(--mouth-y, 0px));
    }
    65%,
    100% {
      transform: translateX(0) translateY(0);
    }
  }
  /* Búsqueda de ojos */
  @keyframes eyeLookRight {
    0%,
    12% {
      transform: translateX(0);
    }
    22%,
    55% {
      transform: translateX(14px);
    }
    65%,
    100% {
      transform: translateX(0);
    }
  }
  @keyframes eyeLookRightMirror {
    0%,
    12% {
      transform: translateX(0);
    }
    22%,
    55% {
      transform: translateX(14px);
    }
    65%,
    100% {
      transform: translateX(0);
    }
  }
  @keyframes eyeLookLeft {
    0%,
    12% {
      transform: translateX(0);
    }
    22%,
    55% {
      transform: translateX(-14px);
    }
    65%,
    100% {
      transform: translateX(0);
    }
  }
  @keyframes eyeLookLeftMirror {
    0%,
    12% {
      transform: translateX(0);
    }
    22%,
    55% {
      transform: translateX(-14px);
    }
    65%,
    100% {
      transform: translateX(0);
    }
  }
  @keyframes eyeLookUp {
    0%,
    12% {
      transform: translateY(0);
    }
    22%,
    55% {
      transform: translateY(-10px);
    }
    65%,
    100% {
      transform: translateY(0);
    }
  }
  @keyframes eyeLookUpMirror {
    0%,
    12% {
      transform: translateY(0);
    }
    22%,
    55% {
      transform: translateY(-10px);
    }
    65%,
    100% {
      transform: translateY(0);
    }
  }

  /* Parpadeo */
  @keyframes idleBlink {
    0%,
    88%,
    100% {
      transform: scaleY(1);
    }
    91% {
      transform: scaleY(0.04);
    }
  }

  /* LISTENING */

  /* Transición suave en todos los elementos de la cara */
  .eye,
  .eyebrow,
  .mouth-single {
    transition:
      transform 0.6s ease,
      filter 0.6s ease;
  }

  @keyframes breathingListen {
    0%,
    100% {
      transform: translateY(0) rotate(-2deg);
    }
    50% {
      transform: translateY(-2px) rotate(-2deg);
    }
  }

  .listening .eye-left {
    animation: listenEyeLeft 6s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(var(--cara-brillo), 0.7));
    transition:
      transform 0.8s ease,
      filter 0.8s ease;
  }
  .listening .eye-right {
    animation: listenEyeRight 6s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(var(--cara-brillo), 0.7));
    transition:
      transform 0.8s ease,
      filter 0.8s ease;
  }

  @keyframes listenEyeLeft {
    0%,
    100% {
      transform: scaleY(1.22) translate(0, 0);
    }
    30% {
      transform: scaleY(1.22) translate(2px, -2px);
    }
    60% {
      transform: scaleY(1.22) translate(-1px, 0px);
    }
  }
  @keyframes listenEyeRight {
    0%,
    100% {
      transform: scaleY(1.22) translate(0, 0);
    }
    30% {
      transform: scaleY(1.22) translate(2px, -2px);
    }
    60% {
      transform: scaleY(1.22) translate(-1px, 0px);
    }
  }

  .listening .eyebrow-left {
    animation: listenBrowLeft 6s ease-in-out infinite;
    transition: transform 0.8s ease;
  }
  .listening .eyebrow-right {
    animation: listenBrowRight 6s ease-in-out infinite;
    transition: transform 0.8s ease;
  }

  @keyframes listenBrowLeft {
    0%,
    100% {
      transform: translateY(0) rotate(0deg);
    }
    40% {
      transform: translateY(-15px) rotate(-4deg);
    }
    70% {
      transform: translateY(-12x) rotate(-3deg);
    }
  }
  @keyframes listenBrowRight {
    0%,
    100% {
      transform: translateY(0) rotate(0deg);
    }
    40% {
      transform: translateY(-11px) rotate(0deg);
    }
    70% {
      transform: translateY(-8px) rotate(0deg);
    }
  }
  @keyframes listenMouth {
    0%,
    100% {
      d: path(
        "M 265.112 239.115 C 265.112 243.048 255.383 247.237 243.382 247.237 C 231.381 247.237 221.652 243.048 221.652 239.115 C 221.652 236.182 230.758 240.737 242.759 240.737 C 254.76 240.737 265.112 236.182 265.112 239.115 Z"
      );
    }
    40% {
      d: path(
        "M 265.112 239.115 C 265.112 247.0 255.383 254.5 243.382 254.5 C 231.381 254.5 221.652 247.0 221.652 239.115 C 221.652 231.23 231.381 235.5 243.382 235.5 C 255.383 235.5 265.112 231.23 265.112 239.115 Z"
      );
    }
  }

  /* Sin listening-active, los elementos están en reposo — la transition CSS
    interpola suavemente desde idle hasta aquí */
  .listening:not(.listening-active) .eye-left {
    transform: scaleY(1);
  }
  .listening:not(.listening-active) .eye-right {
    transform: scaleY(1);
  }
  .listening:not(.listening-active) .eyebrow-left {
    transform: translateY(0);
  }
  .listening:not(.listening-active) .eyebrow-right {
    transform: translateY(0);
  }

  /* Con listening-active, arranca la animación desde una posición ya cercana */
  .listening.listening-active .eye-left {
    animation: listenEyeLeft 6s ease-in-out infinite;
  }
  .listening.listening-active .eye-right {
    animation: listenEyeRight 6s ease-in-out infinite;
  }
  .listening.listening-active .eyebrow-left {
    animation: listenBrowLeft 6s ease-in-out infinite;
  }
  .listening.listening-active .eyebrow-right {
    animation: listenBrowRight 6s ease-in-out infinite;
  }
  .listening.listening-active .mouth-single {
    animation: listenMouth 6s ease-in-out infinite;
  }

  /* THINKING — cara quieta: solo respiración sutil, parpadeo y los 3 puntos */
  .thinking {
    animation: breathing 5s ease-in-out infinite;
  }
  .thinking .eye-left,
  .thinking .eye-right,
  .thinking .eye-sensei-left,
  .thinking .eye-sensei-right {
    animation: idleBlink 5s ease-in-out infinite;
  }
  .thinking .eyebrow-left,
  .thinking .eyebrow-right,
  .thinking .eyebrow-sensei-left,
  .thinking .eyebrow-sensei-right,
  .thinking .mouth,
  .thinking .mouth-single,
  .thinking .mouth-sensei,
  .thinking .mouth-sensei path,
  .thinking path.mouth-sensei {
    animation: none;
  }

  /* Puntos suspensivos encima de la cabeza mientras piensa */
  .thinking-dots {
    position: absolute;
    bottom: calc(100% + 24px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .thinking-dots span {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--cara-esclera), var(--cara-iris-oscuro) 70%);
    box-shadow: 0 0 18px rgba(var(--cara-brillo), 0.55);
    opacity: 0.2;
  }
  .thinking .thinking-dots {
    opacity: 1;
    visibility: visible;
  }
  .thinking .thinking-dots span {
    animation: thinkingDot 1.4s ease-in-out infinite;
  }
  .thinking .thinking-dots span:nth-child(2) {
    animation-delay: 0.2s;
  }
  .thinking .thinking-dots span:nth-child(3) {
    animation-delay: 0.4s;
  }
  @keyframes thinkingDot {
    0%,
    60%,
    100% {
      opacity: 0.2;
      transform: translateY(0) scale(0.85);
    }
    30% {
      opacity: 1;
      transform: translateY(-8px) scale(1);
    }
  }

  /* SPEAKING */
  .eye.blink {
    animation: blink 0.14s ease;
  }

  @keyframes blink {
    0% {
      transform: scaleY(1);
    }
    45% {
      transform: scaleY(0.03);
    }
    100% {
      transform: scaleY(1);
    }
  }

  .mouth-single {
    /* sin animación por defecto */
  }
  .mouth-active {
    animation: mouthSpeak 0.12s ease-in-out infinite alternate;
    animation-delay: 0.05s; /* Pequeño retraso para coincidir con el ataque del audio */
  }

  @keyframes mouthSpeak {
    0% {
      d: path(
        "M 265.112 239.115 C 265.112 243.048 255.383 247.237 243.382 247.237 C 231.381 247.237 221.652 243.048 221.652 239.115 C 221.652 236.182 230.758 240.737 242.759 240.737 C 254.76 240.737 265.112 236.182 265.112 239.115 Z"
      );
    }
    100% {
      d: path(
        "M 265.112 239.115 C 265.112 248.5 255.383 255.0 243.382 255.0 C 231.381 255.0 221.652 248.5 221.652 239.115 C 221.652 229.73 231.381 233.23 243.382 233.23 C 255.383 233.23 265.112 229.73 265.112 239.115 Z"
      );
    }
  }

  /* HAPPY */
  .happy .eye {
    animation: happyAnim 0.45s infinite ease-in-out;
    fill: #ffb347;
  }
  @keyframes happyAnim {
    0%,
    100% {
      transform: scaleY(0.28) translateY(-6%);
    }
    50% {
      transform: scaleY(0.18) translateY(-12%);
    }
  }

  /* ERROR */
  .error .eye {
    fill: #ff3a3a;
    animation: errorAnim 0.18s infinite;
  }
  @keyframes errorAnim {
    0% {
      transform: translateX(-1%);
    }
    50% {
      transform: translateX(1%);
    }
    100% {
      transform: translateX(-1%);
    }
  }

  /* SENSEI */
  /* Ocultar ojos sensei por defecto */
  .eye-sensei {
    display: none;
    width: 175px;
    height: auto;
  }

  /* Al entrar en sensei: ocultar ojos normales, mostrar ojos sensei */
  .sensei .eye-left,
  .sensei .eye-right {
    display: none !important;
    animation: none !important;
  }

  .sensei .eye-sensei {
    display: block;
  }

  /* Transición de entrada suave */
  .eye-sensei {
    opacity: 0;
    transition:
      opacity 0.45s ease,
      transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .sensei .eye-sensei {
    opacity: 1;
  }

  /* Ocultar cejas sensei por defecto */
  .eyebrow-sensei {
    display: none;
    opacity: 0;
    width: 120px;
    height: auto;
    transition:
      opacity 0.45s ease,
      transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  /* Al entrar en sensei: ocultar cejas normales, mostrar cejas sensei */
  .sensei .eyebrow-left,
  .sensei .eyebrow-right {
    display: none !important;
    animation: none !important;
  }

  .sensei .eyebrow-sensei {
    display: block;
    opacity: 1;
    width: 170px;
  }

  .sensei .eyebrows {
    gap: 40px;
  }

  /* =====================
    CEJAS
    ===================== */

  .eyebrow-sensei {
    display: none;
    opacity: 0;
    width: 200px;
    height: auto;
    transition:
      opacity 0.45s ease,
      transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .sensei .eyebrow-left,
  .sensei .eyebrow-right {
    display: none !important;
    animation: none !important;
  }

  .sensei .eyebrow-sensei {
    display: block;
    opacity: 1;
    width: 180px;
    transform: translateY(10px);
    margin-bottom: 20px;
  }

  .sensei .eyebrows {
    gap: 70px;
  }

  /* =====================
   BOCA
   ===================== */

  .mouth-sensei {
    display: none;
    opacity: 0;
    transition:
      opacity 0.45s ease,
      transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .sensei .mouth:not(.mouth-sensei) {
    display: none !important;
    animation: none !important;
  }

  .sensei .mouth-sensei {
    display: block;
    opacity: 1;
    margin-top: 45px;
  }

  /* =====================
   EXTENDER TRANSICIONES GLOBALES A ELEMENTOS SENSEI
   ===================== */
  .transition .eye-sensei,
  .transition .eyebrow-sensei,
  .transition .mouth-sensei {
    transition:
      transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1),
      filter 0.45s ease,
      opacity 0.45s ease;
  }

  /* =====================
   IDLE
   ===================== */
  .idle .eye-sensei-left {
    animation: idleLeft 7s infinite ease-in-out;
  }
  .idle .eye-sensei-right {
    animation: idleRight 7s infinite ease-in-out;
  }

  /* En idle las cejas no tienen animación (solo transform base) -> sin cambios */

  /* =====================
   BLINK (para ambos ojos sensei)
   ===================== */
  .eye-sensei.blink {
    animation: blink 0.14s ease;
  }

  /* =====================
   LISTENING
   ===================== */
  .listening .eye-sensei-left {
    animation: listenEyeLeft 6s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(var(--cara-brillo), 0.7));
  }
  .listening .eye-sensei-right {
    animation: listenEyeRight 6s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(var(--cara-brillo), 0.7));
  }

  .listening .eyebrow-sensei-left {
    animation: listenBrowLeft 6s ease-in-out infinite;
  }
  .listening .eyebrow-sensei-right {
    animation: listenBrowRight 6s ease-in-out infinite;
  }

  .listening.listening-active .mouth-sensei path,
  .listening.listening-active .mouth-sensei.mouth-active path,
  .listening.listening-active path.mouth-sensei {
    animation: listenMouthSensei 6s ease-in-out infinite;
  }

  /* Transiciones de entrada/salida en listening (sin active) */
  .listening:not(.listening-active) .eye-sensei-left,
  .listening:not(.listening-active) .eye-sensei-right {
    transform: scaleY(1); /* respeta rotación base si la tuviera */
  }
  .listening:not(.listening-active) .eyebrow-sensei-left,
  .listening:not(.listening-active) .eyebrow-sensei-right {
    transform: translateY(0);
  }

  /* =====================
   THINKING — sin movimiento; parpadeo y quietud se controlan en la sección THINKING de arriba
   ===================== */

  /* =====================
   SPEAKING (boca)
   ===================== */
  .mouth-sensei.mouth-active path,
  .mouth-sensei path.mouth-active,
  .mouth-sensei.mouth-active {
    animation: mouthSpeakSensei 0.1s ease-in-out infinite alternate;
    animation-delay: 0.05s;
  }

  /* =====================
   HAPPY
   ===================== */
  .happy .eye-sensei {
    animation: happyAnim 0.45s infinite ease-in-out;
    fill: #ffb347;
  }

  /* =====================
   ERROR
   ===================== */
  .error .eye-sensei {
    fill: #ff3a3a;
