<style>
  /* Paleta de la cara (ámbar, a juego con la carcasa #aa8d5f).
     Ajustar aquí viéndolo en la pantalla del robot: no da el mismo color que el plástico. */
  :root {
    --cara-fondo: #15100a;
    --cara-esclera: #fff3da;
    --cara-iris-claro: #f6c063;
    --cara-iris-oscuro: #8a5a1e;
    --cara-pupila: #1a1006;
    --cara-ceja-claro: #b98536;
    --cara-ceja-oscuro: #7a5220;
    --cara-boca-claro: #e0a44d;
    --cara-boca-oscuro: #8a5a1e;
    --cara-parpado: #4a3012;
    --cara-parpado-piel: #2e1f0f;
    --cara-parpado-borde: #0d0904;
    --cara-brillo: 224, 162, 74; /* canales RGB: se usa con rgba(var(--cara-brillo), alfa) */
    /* Halo: pantalla redonda de 480x480, tiene que quedar dentro y apenas notarse */
    --cara-halo-color: 150, 98, 36;
    --cara-halo-tamano: 420px;
    /* En el robot Chromium no baja de 500 px de ventana y la pantalla mide 480:
       sin esto la cara queda 10 px a la derecha. Sirve también para ajustar el centrado. */
    --cara-ancho: {{ '480px' if es_kiosko else '100vw' }};
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--cara-fondo);
    width: var(--cara-ancho);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;   /* sin zoom por doble toque: el doble toque navega */
  }

  /* Todo el movimiento de la cara lo pone el motor de _scripts.html.
     Aquí solo hay disposición, y lo que no depende del estado (halo y puntos). */
  .face {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    will-change: transform;
  }

  /* Halo cálido detrás de la cara. Sin filter: blur, que en la Pi se recalcula en
     cada frame; solo escala y opacidad, que las resuelve la GPU sin repintar. */
  .face::before {
    content: "";
    position: absolute;
    left: 50%; /* relativo a .face: su transform la hace contenedor */
    top: 48%;
    z-index: -1;
    pointer-events: none;
    width: var(--cara-halo-tamano);
    height: var(--cara-halo-tamano);
    border-radius: 50%;
    background: radial-gradient(
      circle closest-side,
      rgba(var(--cara-halo-color), 0.34) 0%,
      rgba(var(--cara-halo-color), 0.2) 45%,
      rgba(var(--cara-halo-color), 0.07) 75%,
      transparent 100%
    );
    will-change: transform, opacity;
    animation: faceGlow 5.5s ease-in-out infinite;
  }
  @keyframes faceGlow {
    0%,
    100% {
      transform: translate(-50%, -50%) scale(0.97);
      opacity: 0.85;
    }
    50% {
      transform: translate(-50%, -50%) scale(1.05);
      opacity: 1;
    }
  }

  /* CEJAS */
  .eyebrows {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 170px;
    margin-bottom: 15px;
    z-index: 2;
  }
  .eyebrow {
    width: 90px;
    height: auto;
    transform-origin: center center;
    will-change: transform;
  }

  /* OJOS */
  .eyes {
    display: flex;
    justify-content: center;
    gap: 70px;
  }
  .eye {
    width: 150px;
    height: auto;
    transform-origin: center center;
    will-change: transform;
  }
  /* Rotación base: mirando hacia la nariz */
  .eye-left {
    rotate: 12deg;
  }
  .eye-right {
    rotate: -12deg;
  }
  .pupila {
    transform-box: fill-box;
    transform-origin: center;
  }
  .parpado {
    fill: var(--cara-parpado-piel);
    stroke: var(--cara-parpado-borde);
    stroke-width: 3px;
  }

  /* BOCA */
  .mouth-container {
    margin-top: 20px;
    overflow: visible;
  }
  .mouth {
    overflow: visible;
    width: 90px;
    height: auto;
    transform-origin: center center;
    will-change: transform;
  }

  /* Puntos suspensivos encima de la cabeza mientras piensa */
  .thinking-dots {
    position: absolute;
    bottom: calc(100% + 24px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .thinking-dots span {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--cara-esclera), var(--cara-iris-oscuro) 70%);
    box-shadow: 0 0 18px rgba(var(--cara-brillo), 0.55);
    opacity: 0.2;
  }
  .thinking .thinking-dots {
    opacity: 1;
    visibility: visible;
  }
  .thinking .thinking-dots span {
    animation: thinkingDot 1.4s ease-in-out infinite;
  }
  .thinking .thinking-dots span:nth-child(2) {
    animation-delay: 0.2s;
  }
  .thinking .thinking-dots span:nth-child(3) {
    animation-delay: 0.4s;
  }
  @keyframes thinkingDot {
    0%,
    60%,
    100% {
      opacity: 0.2;
      transform: translateY(0) scale(0.85);
    }
    30% {
      opacity: 1;
      transform: translateY(-8px) scale(1);
    }
  }

  /* SENSEI: cambia las piezas; el motor las anima igual */
  .eye-sensei {
    display: none;
    width: 175px;
    height: auto;
  }
  .sensei .eye-left,
  .sensei .eye-right {
    display: none;
  }
  .sensei .eye-sensei {
    display: block;
  }
  .eyebrow-sensei {
    display: none;
    width: 200px;
    height: auto;
  }
  .sensei .eyebrow-left,
  .sensei .eyebrow-right {
    display: none;
  }
  .sensei .eyebrow-sensei {
    display: block;
    width: 180px;
    translate: 0 10px;
    margin-bottom: 20px;
  }
  .sensei .eyebrows {
    gap: 70px;
  }
  .mouth-sensei {
    display: none;
  }
  .sensei .mouth:not(.mouth-sensei) {
    display: none;
  }
  .sensei .mouth-sensei {
    display: block;
    margin-top: 45px;
  }
</style>
