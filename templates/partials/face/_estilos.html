<style>
  /* Paleta de la cara (ámbar, a juego con la carcasa #aa8d5f).
     Ajustar aquí viéndolo en la pantalla del robot: no da el mismo color que el plástico. */
  :root {
    --cara-fondo: #15100a;
    --cara-esclera: #fff3da;
    --cara-iris-claro: #f6c063;
    --cara-iris-oscuro: #8a5a1e;
    --cara-pupila: #1a1006;
    --cara-ceja-claro: #b98536;
    --cara-ceja-oscuro: #7a5220;
    --cara-boca-claro: #e0a44d;
    --cara-boca-oscuro: #8a5a1e;
    --cara-parpado: #4a3012;
    --cara-parpado-luz: #a87c3e;
    --cara-parpado-piel: #6e4d25;
    --cara-parpado-sombra: #33220f;
    --cara-parpado-borde: #120b04;
    --cara-brillo: 224, 162, 74; /* canales RGB: se usa con rgba(var(--cara-brillo), alfa) */
    /* Halo: pantalla redonda de 480x480, tiene que quedar dentro y apenas notarse */
    --cara-halo-color: 150, 98, 36;
    --cara-halo-tamano: 420px;
    /* En el robot Chromium no baja de 500 px de ventana y la pantalla mide 480:
       sin esto la cara queda 10 px a la derecha. Sirve también para ajustar el centrado. */
    --cara-ancho: {{ '480px' if es_kiosko else '100vw' }};
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--cara-fondo);
    width: var(--cara-ancho);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;   /* sin zoom por doble toque: el doble toque navega */
  }

  /* Todo el movimiento de la cara lo pone el motor de _scripts.html.
     Aquí solo hay disposición, y lo que no depende del estado (halo y puntos). */
  .face {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    will-change: transform;
  }

  /* Halo cálido detrás de la cara. Quieto y sin filter: blur: en la Pi animarlo
     consume más que todo el motor de la cara. Ya se mueve con ella. */
  .face::before {
    content: "";
    position: absolute;
    left: 50%; /* relativo a .face: su transform la hace contenedor */
    top: 48%;
    transform: translate(-50%, -50%);
    z-index: -1;
    pointer-events: none;
    width: var(--cara-halo-tamano);
    height: var(--cara-halo-tamano);
    border-radius: 50%;
    background: radial-gradient(
      circle closest-side,
      rgba(var(--cara-halo-color), 0.34) 0%,
      rgba(var(--cara-halo-color), 0.2) 45%,
      rgba(var(--cara-halo-color), 0.07) 75%,
      transparent 100%
    );
  }

  /* CEJAS */
  .eyebrows {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 170px;
    margin-bottom: 15px;
    z-index: 2;
  }
  .eyebrow {
    width: 90px;
    height: auto;
    transform-origin: center center;
    will-change: transform;
  }

  /* OJOS */
  .eyes {
    display: flex;
    justify-content: center;
    gap: 70px;
  }
  .eye {
    width: 150px;
    height: auto;
    transform-origin: center center;
    will-change: transform;
  }
  /* Rotación base: mirando hacia la nariz */
  .eye-left {
    rotate: 12deg;
  }
  .eye-right {
    rotate: -12deg;
  }
  .pupila {
    transform-box: fill-box;
    transform-origin: center;
  }
  .parpado-borde {
    fill: var(--cara-parpado-borde);
  }
  .parpado-borde-inf {
    fill: var(--cara-parpado-sombra);
  }
  .parpado-pliegue {
    fill: none;
    stroke: var(--cara-parpado-sombra);
    stroke-width: 2.5px;
    stroke-linecap: round;
  }

  /* BOCA */
  .mouth-container {
    margin-top: 20px;
    overflow: visible;
  }
  .mouth {
    overflow: visible;
    width: 90px;
    height: auto;
    transform-origin: center center;
    will-change: transform;
  }

  /* Puntos suspensivos encima de la cabeza mientras piensa */
  .thinking-dots {
    position: absolute;
    bottom: calc(100% + 24px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .thinking-dots span {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--cara-esclera), var(--cara-iris-oscuro) 70%);
    box-shadow: 0 0 18px rgba(var(--cara-brillo), 0.55);
    opacity: 0.2;
  }
  .thinking .thinking-dots {
    opacity: 1;
    visibility: visible;
  }
  .thinking .thinking-dots span {
    animation: thinkingDot 1.4s ease-in-out infinite;
  }
  .thinking .thinking-dots span:nth-child(2) {
    animation-delay: 0.2s;
  }
  .thinking .thinking-dots span:nth-child(3) {
    animation-delay: 0.4s;
  }
  @keyframes thinkingDot {
    0%,
    60%,
    100% {
      opacity: 0.2;
      transform: translateY(0) scale(0.85);
    }
    30% {
      opacity: 1;
      transform: translateY(-8px) scale(1);
    }
  }

  /* SENSEI: cambia las piezas; el motor las anima igual */
  .eye-sensei {
    display: none;
    width: 175px;
    height: auto;
  }
  .sensei .eye-left,
  .sensei .eye-right {
    display: none;
  }
  .sensei .eye-sensei {
    display: block;
  }
  .eyebrow-sensei {
    display: none;
    width: 200px;
    height: auto;
  }
  .sensei .eyebrow-left,
  .sensei .eyebrow-right {
    display: none;
  }
  .sensei .eyebrow-sensei {
    display: block;
    width: 180px;
    translate: 0 10px;
    margin-bottom: 20px;
  }
  .sensei .eyebrows {
    gap: 70px;
  }
  .mouth-sensei {
    display: none;
  }
  .sensei .mouth:not(.mouth-sensei) {
    display: none;
  }
  .sensei .mouth-sensei {
    display: block;
    margin-top: 45px;
  }

  /* =====================================================================
     GESTOS KAWAII — solo las capas de adorno.
     El movimiento (cabeza, párpados, cejas, boca) lo hace el motor de
     _scripts.html con sus muelles; aquí no se anima nada de lo que mueve él.
     El motor pone .gesto-<nombre> en #face y la duración en --gesto-dur.
     ===================================================================== */
  :root {
    --cara-rubor: 255, 128, 128;          /* canales RGB de las mejillas */
    --cara-corazon: #ff6f8e;
  }
  .face {
    position: relative; /* ancla de .cara-fx */
    --gesto-dur: 3s;
  }
  .eyes {
    position: relative;
  }

  /* Pupila de corazón: vive dentro del iris, se mueve con la mirada y la tapan los párpados */
  .pupila-corazon {
    fill: var(--cara-corazon);
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    scale: 0.3;
    transition: opacity 0.25s ease, scale 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .gesto-corazones .pupila-corazon {
    opacity: 1;
    scale: 1;
    animation: kwLatido 0.6s ease-in-out 0.35s infinite;
  }

  /* ---- Capas sobre los ojos ---- */
  .ojos-fx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }
  .ojos-fx .slot {
    position: absolute;
    top: 0;
    height: 100%;
    width: calc((100% - 70px) / 2); /* mismo gap que .eyes */
  }
  .ojos-fx .slot-izq { left: 0; }
  .ojos-fx .slot-der { right: 0; }
  .ov {
    position: absolute;
    opacity: 0;
    overflow: visible;
  }
  .ov-brillo {
    fill: var(--cara-esclera);
    filter: drop-shadow(0 0 6px rgba(var(--cara-brillo), 0.9));
  }
  .ov-brillo-1 { width: 30%; top: 2%; right: -2%; }
  .ov-brillo-2 { width: 17%; top: 64%; left: 2%; }
  .slot-der .ov-brillo-1 { right: auto; left: -2%; }
  .slot-der .ov-brillo-2 { left: auto; right: 2%; }
  .ov-rubor {
    width: 66px;
    height: 30px;
    bottom: -4%;
    border-radius: 50%;
    background: radial-gradient(
      ellipse at center,
      rgba(var(--cara-rubor), 0.8) 0%,
      rgba(var(--cara-rubor), 0.38) 55%,
      transparent 72%
    );
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slot-izq .ov-rubor { left: 0; }
  .slot-der .ov-rubor { right: 0; }
  .ov-rubor svg {
    width: 58%;
    fill: none;
    stroke: rgba(var(--cara-rubor), 0.95);
    stroke-width: 3.5;
    stroke-linecap: round;
  }

  /* ---- Partículas alrededor de la cara ---- */
  .cara-fx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 4;
  }
  .fx {
    position: absolute;
    opacity: 0;
    display: block;
  }
  .fx svg { display: block; width: 100%; overflow: visible; }
  .fx-corazon { width: 30px; }
  .fx-corazon path { fill: var(--cara-corazon); }
  .fx-c1 { left: -2%;  top: 34%; }
  .fx-c2 { right: -1%; top: 26%; width: 24px; }
  .fx-c3 { left: 14%;  top: -6%; width: 22px; }
  .fx-c4 { right: 15%; top: -2%; }
  .fx-nota { width: 26px; fill: var(--cara-iris-claro); filter: drop-shadow(0 0 6px rgba(var(--cara-brillo), 0.6)); }
  .fx-n1 { right: -2%; top: 24%; }
  .fx-n2 { right: 12%; top: -8%; width: 34px; }
  .fx-n3 { left: -3%;  top: 14%; }
  .fx-zzz {
    right: 6%;
    top: 4%;
    font: 800 24px/1 "Nunito", "Varela Round", "DejaVu Sans", sans-serif;
    color: var(--cara-esclera);
    text-shadow: 0 0 10px rgba(var(--cara-brillo), 0.7);
  }
  .fx-z2 { font-size: 32px; }
  .fx-z3 { font-size: 42px; }
  .fx-gota { width: 34px; left: 2%; top: 0; }
  .fx-gota path { fill: #9fd8ff; }
  .fx-gota ellipse { fill: #ffffff; opacity: 0.7; }

  /* ---- Keyframes de las capas ---- */
  @keyframes kwRubor {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    18%, 80% { opacity: 1; transform: scale(1); }
  }
  @keyframes kwLatido {
    0%, 100% { scale: 1; }
    30% { scale: 1.18; }
    55% { scale: 0.95; }
  }
  @keyframes kwBrillo {
    0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
    45% { opacity: 1; transform: scale(1) rotate(45deg); }
  }
  @keyframes kwFlota {
    0% { opacity: 0; transform: translate(0, 14px) scale(0.3) rotate(0deg); }
    18% { opacity: 1; transform: translate(-4px, -6px) scale(1) rotate(-8deg); }
    55% { opacity: 1; transform: translate(6px, -38px) scale(1) rotate(8deg); }
    100% { opacity: 0; transform: translate(-2px, -76px) scale(0.8) rotate(-6deg); }
  }
  @keyframes kwZzz {
    0% { opacity: 0; transform: translate(0, 10px) scale(0.4) rotate(-10deg); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translate(34px, -64px) scale(1.1) rotate(12deg); }
  }
  @keyframes kwGota {
    0%, 100% { opacity: 0; transform: translateY(-6px) scale(0.6); }
    15% { opacity: 1; transform: translateY(0) scale(1); }
    80% { opacity: 1; transform: translateY(26px) scale(1); }
  }

  /* ---- Qué capas enciende cada gesto ---- */
  .gesto-feliz .ov-rubor,
  .gesto-corazones .ov-rubor,
  .gesto-rubor .ov-rubor,
  .gesto-musica .ov-rubor { animation: kwRubor var(--gesto-dur) ease both; }
  .gesto-rubor .ov-rubor { width: 86px; height: 38px; }

  .gesto-guino .slot-der .ov-brillo-1 { animation: kwBrillo 0.8s ease-in-out 0.3s 2 both; }
  .gesto-estrellitas .ov-brillo-1 { animation: kwBrillo 1.2s ease-in-out 0.15s 2 both; }
  .gesto-estrellitas .ov-brillo-2 { animation: kwBrillo 1.2s ease-in-out 0.65s 2 both; }
  /* Brillitos dentro de la pupila (feliz y estrellitas): se mueven con la
     mirada y los tapan los párpados, como los reflejos de los ojos de anime */
  .brillo-ojo {
    fill: #ffffff;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    scale: 0.3;
    transition: opacity 0.3s ease;
  }
  .emocion-feliz .brillo-ojo,
  .gesto-feliz .brillo-ojo,
  .gesto-estrellitas .brillo-ojo { animation: kwTitila 1.4s ease-in-out infinite; }
  .emocion-feliz .brillo-ojo-2,
  .gesto-feliz .brillo-ojo-2,
  .gesto-estrellitas .brillo-ojo-2 { animation-delay: 0.7s; }
  @keyframes kwTitila {
    0%, 100% { opacity: 0.6; scale: 0.55; rotate: 0deg; }
    50% { opacity: 1; scale: 1; rotate: 45deg; }
  }

  .gesto-corazones .fx-corazon { animation: kwFlota 1.9s ease-out both; }
  .gesto-corazones .fx-c1 { animation-delay: 0.25s; }
  .gesto-corazones .fx-c2 { animation-delay: 0.65s; }
  .gesto-corazones .fx-c3 { animation-delay: 1.05s; }
  .gesto-corazones .fx-c4 { animation-delay: 1.35s; }

  .gesto-musica .fx-nota { animation: kwFlota 2s ease-out both; }
  .gesto-musica .fx-n1 { animation-delay: 0.35s; }
  .gesto-musica .fx-n2 { animation-delay: 1.25s; }
  .gesto-musica .fx-n3 { animation-delay: 2.15s; }

  /* zZz en bucle mientras duerme; las suelta en cuanto se despierta */
  .gesto-dormido .fx-zzz,
  .gesto-dormirse .fx-zzz { animation: kwZzz 2.4s ease-out infinite; }
  /* Antes del reloj las zZz salen cuando ya se ha dormido del todo (a los 9,6 s) */
  .gesto-dormirse .fx-z1 { animation-delay: 10s; }
  .gesto-dormirse .fx-z2 { animation-delay: 10.8s; }
  .gesto-dormirse .fx-z3 { animation-delay: 11.6s; }
  .gesto-dormido .fx-z1 { animation-delay: 1.6s; }
  .gesto-dormido .fx-z2 { animation-delay: 2.4s; }
  .gesto-dormido .fx-z3 { animation-delay: 3.2s; }
  .gesto-dormido.despierta .fx-zzz { animation: none; }

  .gesto-apuro .fx-gota { animation: kwGota var(--gesto-dur) ease-in both; }

  /* Caricia y cosquillas */
  /* Sin keyframes: duran lo que dure el toque, así que se encienden y apagan con transición */
  .gesto-caricia .ov-rubor,
  .gesto-cosquillas .ov-rubor { opacity: 1; }
  .gesto-caricia .fx-c2 { animation: kwFlota 1.8s ease-out 0.4s both; }
  .gesto-caricia .fx-c3 { animation: kwFlota 1.8s ease-out 1.1s both; }
  .fx-ja {
    font: 800 22px/1 "Nunito", "Varela Round", "DejaVu Sans", sans-serif;
    color: var(--cara-iris-claro);
    text-shadow: 0 0 8px rgba(var(--cara-brillo), 0.7);
  }
  .fx-j1 { left: -4%; top: 30%; }
  .fx-j2 { right: -4%; top: 22%; font-size: 26px; }
  .fx-j3 { right: 14%; top: -6%; }
  .gesto-cosquillas .fx-ja { animation: kwFlota 1.3s ease-out infinite; }
  .gesto-cosquillas .fx-j2 { animation-delay: 0.45s; }
  .gesto-cosquillas .fx-j3 { animation-delay: 0.9s; }

  /* Emoción al hablar: el cariño se nota en las mejillas */
  .ov-rubor { transition: opacity 0.5s ease; }
  .emocion-carino .ov-rubor { opacity: 0.85; }

  /* Signos sobre la cabeza: "!" de sorpresa y "?" de pensar */
  .fx-signo {
    font: 900 46px/1 "Nunito", "Varela Round", "DejaVu Sans", sans-serif;
    color: var(--cara-esclera);
    text-shadow: 0 0 14px rgba(var(--cara-brillo), 0.8);
  }
  .fx-exclama { right: 4%; top: -16%; }
  .fx-pregunta { right: 2%; top: -14%; }
  .emocion-sorpresa .fx-exclama { animation: kwSignoPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .emocion-pensativo .fx-pregunta { animation: kwSignoPop 0.5s ease both, kwSignoFlota 2.4s ease-in-out 0.5s infinite; }
  @keyframes kwSignoPop {
    from { opacity: 0; transform: translateY(12px) scale(0.3) rotate(-15deg); }
    to { opacity: 1; transform: translateY(0) scale(1) rotate(8deg); }
  }
  @keyframes kwSignoFlota {
    0%, 100% { opacity: 1; transform: translateY(0) rotate(8deg); }
    50% { opacity: 1; transform: translateY(-7px) rotate(-6deg); }
  }

  /* Lagrimita: asoma bajo el ojo izquierdo y cae por la mejilla, una y otra vez */
  .fx-lagrima { width: 18px; left: 25%; top: 64%; }
  .fx-lagrima path { fill: #9fd8ff; }
  .fx-lagrima ellipse { fill: #ffffff; opacity: 0.75; }
  .emocion-triste .fx-lagrima { animation: kwLagrima 2.6s ease-in 0.5s infinite; }
  @keyframes kwLagrima {
    0% { opacity: 0; transform: translateY(0) scale(0.3); }
    20% { opacity: 1; transform: translateY(0) scale(1); }
    40% { opacity: 1; transform: translateY(4px) scale(1); }
    100% { opacity: 0; transform: translateY(70px) scale(0.85); }
  }
</style>
