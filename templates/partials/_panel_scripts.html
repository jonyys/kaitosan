{% include 'partials/_confirm_pop.html' %}
{% include 'partials/_flash_pop.html' %}

<script>
(function () {
    var path = location.pathname;
    var SCROLL_KEY = 'scrollY:' + path;
    var DONE_KEY = 'flashDone:' + path;
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    // Guarda la posición de scroll al enviar un formulario, para no saltar arriba.
    function saveScroll() {
        sessionStorage.setItem(SCROLL_KEY, JSON.stringify([window.scrollY, Date.now()]));
    }
    document.addEventListener('submit', function (e) {
        if (e.target && e.target.method === 'dialog') return;  // el "OK" del pop-up no navega
        saveScroll();
    });

    document.addEventListener('DOMContentLoaded', function () {
        // ¿Llegamos por una recarga o por una acción en la propia página?
        // Solo entonces reabrimos los desplegables y restauramos el scroll.
        // Si venimos de fuera (o se volvió a entrar), nada abierto.
        var rawScroll = sessionStorage.getItem(SCROLL_KEY);
        sessionStorage.removeItem(SCROLL_KEY);
        var scroll = null;
        try { scroll = rawScroll && JSON.parse(rawScroll); } catch (e) {}
        var reciente = scroll && Date.now() - scroll[1] < 5000;
        var navType = ((performance.getEntriesByType('navigation')[0]) || {}).type;
        var mantener = reciente || navType === 'reload';

        // 1) Desplegables abiertos entre recargas (por página).
        document.querySelectorAll('details.acc').forEach(function (d, i) {
            var key = path + '#acc' + i;
            if (mantener) {
                if (localStorage.getItem(key) === '1') d.open = true;
            } else {
                localStorage.removeItem(key);
            }
            d.addEventListener('toggle', function () {
                localStorage.setItem(key, d.open ? '1' : '0');
            });
        });

        // 2) Restaura el scroll si venimos de un submit reciente (< 5 s).
        if (reciente) window.scrollTo(0, scroll[0]);

        // Volver con "atrás" (restaurada desde bfcache, sin recarga): cerrar todo.
        window.addEventListener('pageshow', function (e) {
            if (!e.persisted) return;
            document.querySelectorAll('details.acc').forEach(function (d, i) {
                localStorage.removeItem(path + '#acc' + i);
                d.open = false;
            });
        });

        // 3) El pop-up de resultado del servidor lo pinta partials/_flash_pop.html.

        // 4) Confirmación de borrado: usa el pop-up compartido (window.confirmar).
        document.querySelectorAll('form[onsubmit*="confirm("]').forEach(function (f) {
            var m = /confirm\(\s*(['"])([\s\S]*?)\1\s*\)/.exec(f.getAttribute('onsubmit') || '');
            if (m) f.setAttribute('data-confirm', m[2].replace(/\\(['"])/g, '$1'));
            f.removeAttribute('onsubmit');
        });

        document.addEventListener('submit', function (e) {
            var f = e.target;
            if (!f || !f.hasAttribute('data-confirm') || f.dataset.confirmed) return;
            e.preventDefault();
            window.confirmar(f.getAttribute('data-confirm'), { hechoMsg: 'Eliminado' }).then(function (ok) {
                if (!ok) return;
                sessionStorage.setItem(DONE_KEY, Date.now());
                saveScroll();
                f.dataset.confirmed = '1';   // deja pasar el submit real
                f.submit();
            });
        });
    });
})();
</script>
