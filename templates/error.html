<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ codigo }} · Kaito</title>
    {% include 'partials/admin/_estilos.html' %}
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .err-code {
        font-size: clamp(56px, 18vw, 88px);
        font-weight: 700;
        color: var(--rosa-medio);
        line-height: 1;
      }
      .card h1 {
        justify-content: center;
        margin: 10px 0 6px;
      }
      .card p {
        color: var(--text-soft);
        font-size: 14px;
        margin-bottom: 22px;
      }
      .card .btn {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="err-code">{{ codigo }}</div>
      <h1>{{ titulo }}</h1>
      <p>{{ mensaje }}</p>
      <a href="/admin"><button class="btn btn-blue">Volver al panel</button></a>
    </div>
  </body>
</html>
