<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaito — Login</title>
    {% include 'partials/admin/_estilos.html' %}
    <style>
        /* Login: reutiliza la paleta pastel de _estilos.html; solo centra la tarjeta. */
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { width: 100%; max-width: 340px; text-align: center; }
        .card h1 { justify-content: center; }
        .card p { color: var(--text-soft); font-size: 14px; margin-bottom: 24px; }
        .card .btn { width: 100%; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🤖 Kaito</h1>
        <p>Panel de administración</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="text"
                   name="user"
                   placeholder="Usuario"
                   autocomplete="username"
                   autofocus>
            <input type="password"
                   name="password"
                   placeholder="Contraseña"
                   autocomplete="current-password">
            <button type="submit" class="btn btn-blue">Entrar</button>
        </form>
    </div>
</body>
</html>
